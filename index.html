<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TI4 Companion - Game Cycle Edition v2</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen pb-20 md:pb-10">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const ALL_FACTIONS = [
      // Базовая игра
      { id: 'sol', name: 'Федерация Сол', color: '#3b82f6', exp: 'base', iconUrl: './factions/federation-of-sol.webp' },
      { id: 'jolnar', name: 'Университеты Джол-Нара', color: '#06b6d4', exp: 'base', iconUrl: './factions/universities-of-jol-nar.webp' },
      { id: 'hacan', name: 'Эмират Хакан', color: '#eab308', exp: 'base', iconUrl: './factions/emirates-of-hacan.webp' },
      { id: 'xxcha', name: 'Королевство Ззча', color: '#22c55e', exp: 'base', iconUrl: './factions/xxcha-kingdom.webp' },
      { id: 'nekro', name: 'Вирус Некро', color: '#ef4444', exp: 'base', iconUrl: './factions/nekro-virus.webp' },
      { id: 'saar', name: 'Кланы Сааров', color: '#a855f7', exp: 'base', iconUrl: './factions/clan-of-saar.webp' },
      { id: 'l1z1x', name: 'Иерархия L1Z1X', color: '#64748b', exp: 'base', iconUrl: './factions/l1z1x-mindnet.webp' },
      { id: 'letnev', name: 'Баронат Летнев', color: '#475569', exp: 'base', iconUrl: './factions/barony-of-letnev.webp' },
      { id: 'arborec', name: 'Древостой Арбореков', color: '#15803d', exp: 'base', iconUrl: './factions/arborec.webp' },
      { id: 'creuss', name: 'Призраки Крёсса', color: '#38bdf8', exp: 'base', iconUrl: './factions/ghosts-of-creuss.webp' },
      { id: 'mentak', name: 'Коалиция Ментака', color: '#f97316', exp: 'base', iconUrl: './factions/mentak-coalition.webp' },
      { id: 'muaat', name: 'Уполномоченные Муаата', color: '#dc2626', exp: 'base', iconUrl: './factions/embers-of-muaat.webp' },
      { id: 'naalu', name: 'Валлиада Наалу', color: '#84cc16', exp: 'base', iconUrl: './factions/naalu-collective.webp' },
      { id: 'saardakk', name: 'Сардакк Ноур', color: '#991b1b', exp: 'base', iconUrl: './factions/sardakk-norr.webp' },
      { id: 'yin', name: 'Братство Инь', color: '#e2e8f0', exp: 'base', iconUrl: './factions/yin-brotherhood.webp' },
      { id: 'yssaril', name: 'Племена Иссарилов', color: '#166534', exp: 'base', iconUrl: './factions/yssaril-tribes.webp' },
      { id: 'winnu', name: 'Винну', color: '#a855f7', exp: 'base', iconUrl: './factions/winnu.webp' },

      // Prophecy of Kings (PoK)
      { id: 'argent', name: 'Летный Альянс Аргентов', color: '#facc15', exp: 'pok', iconUrl: './factions/argent-flight.webp' },
      { id: 'empyrean', name: 'Эмпиреи', color: '#818cf8', exp: 'pok', iconUrl: './factions/empyrean.webp' },
      { id: 'mahact', name: 'Генетическая Империя Махакт', color: '#fbbf24', exp: 'pok', iconUrl: './factions/mahact-gene-sorcerers.webp' },
      { id: 'naazrokha', name: 'Альянс Нааз-Роха', color: '#10b981', exp: 'pok', iconUrl: './factions/naaz-rokha-alliance.webp' },
      { id: 'nomad', name: 'Кочевник (Nomad)', color: '#f43f5e', exp: 'pok', iconUrl: './factions/nomad.webp' },
      { id: 'titans', name: 'Титаны Ула', color: '#a1a1aa', exp: 'pok', iconUrl: './factions/titans-of-ul.webp' },
      { id: 'vuilraith', name: 'Кабала Вуил’Райт', color: '#b91c1c', exp: 'pok', iconUrl: './factions/vuil-raith-cabal.webp' },

      // Thunder's Edge (TE) и модули
      { id: 'keleres_argent', name: 'Совет Келерес (Аргенты)', color: '#38bdf8', exp: 'te', iconUrl: './factions/council-keleres-argent.webp' },
      { id: 'keleres_mentak', name: 'Совет Келерес (Ментак)', color: '#38bdf8', exp: 'te', iconUrl: './factions/council-keleres-mentak.webp' },
      { id: 'keleres_xxcha', name: 'Совет Келерес (Ззча)', color: '#38bdf8', exp: 'te', iconUrl: './factions/council-keleres-xxcha.webp' },
      { id: 'crimson', name: 'Багряное Восстание', color: '#dc2626', exp: 'te', iconUrl: './factions/crimson-rebellion.webp' },
      { id: 'deepwrought', name: 'Школа Глубин', color: '#0284c7', exp: 'te', iconUrl: './factions/deepwrought-scholarate.webp' },
      { id: 'firmament', name: 'Твердь Небесная', color: '#475569', exp: 'te', iconUrl: './factions/firmament-obsidian.webp' },
      { id: 'bastion', name: 'Последний Оплот', color: '#ca8a04', exp: 'te', iconUrl: './factions/last-bastion.webp' },
      { id: 'ralnel', name: 'Консорциум Рал-Нель', color: '#2563eb', exp: 'te', iconUrl: './factions/ral-nel-consortium.webp' }
    ];

    const STRATEGY_CARDS = [
      { id: 1, name: '1. Величие', initiative: 1, color: 'border-red-500 bg-red-950/40 text-red-300' },
      { id: 2, name: '2. Дипломатия', initiative: 2, color: 'border-amber-500 bg-amber-950/40 text-amber-300' },
      { id: 3, name: '3. Политика', initiative: 3, color: 'border-yellow-500 bg-yellow-950/40 text-yellow-300' },
      { id: 4, name: '4. Строительство', initiative: 4, color: 'border-emerald-500 bg-emerald-950/40 text-emerald-300' },
      { id: 5, name: '5. Торговля', initiative: 5, color: 'border-teal-500 bg-teal-950/40 text-teal-300' },
      { id: 6, name: '6. Война', initiative: 6, color: 'border-cyan-500 bg-cyan-950/40 text-cyan-300' },
      { id: 7, name: '7. Технологии', initiative: 7, color: 'border-blue-500 bg-blue-950/40 text-blue-300' },
      { id: 8, name: '8. Экспансия', initiative: 8, color: 'border-purple-500 bg-purple-950/40 text-purple-300' }
    ];

    const DEFAULT_OBJECTIVES = [
      { id: 'obj_1', title: 'Укрепить границы', stage: 1, points: 1, desc: 'Иметь сооружения на 2 планетах вне родной системы' },
      { id: 'obj_2', title: 'Расширить владения', stage: 1, points: 1, desc: 'Контролировать 6 планет вне родной системы' }
    ];

    function App() {
      // Переключатель активного состояния игры
      const [gameStarted, setGameStarted] = useState(false);

      const [targetScore, setTargetScore] = useState(10);
      const [activeTab, setActiveTab] = useState('scoreboard');
      
      const [usePok, setUsePok] = useState(true);
      const [useTe, setUseTe] = useState(true);

      const [players, setPlayers] = useState([
        { id: 1, name: 'Игрок 1', factionId: 'sol', secrets: 0, extra: 0, breakthrough: false },
        { id: 2, name: 'Игрок 2', factionId: 'jolnar', secrets: 0, extra: 0, breakthrough: false },
        { id: 3, name: 'Игрок 3', factionId: 'hacan', secrets: 0, extra: 0, breakthrough: false },
        { id: 4, name: 'Игрок 4', factionId: 'xxcha', secrets: 0, extra: 0, breakthrough: false },
        { id: 5, name: 'Игрок 5', factionId: 'nekro', secrets: 0, extra: 0, breakthrough: false },
        { id: 6, name: 'Игрок 6', factionId: 'saar', secrets: 0, extra: 0, breakthrough: false },
      ]);

      const [objectives, setObjectives] = useState(DEFAULT_OBJECTIVES);
      const [completions, setCompletions] = useState({});
      
      const [strategyPicks, setStrategyPicks] = useState({});
      const [turnOrder, setTurnOrder] = useState([]);
      const [activeTurnIdx, setActiveTurnIdx] = useState(0);
      const [passed, setPassed] = useState({});

      const availableFactions = ALL_FACTIONS.filter(f => {
        if (f.exp === 'base') return true;
        if (f.exp === 'pok' && usePok) return true;
        if (f.exp === 'te' && useTe) return true;
        return false;
      });

      // Функция ЗАПУСКА ИГРЫ
      const handleStartGame = () => {
        setGameStarted(true);
        setActiveTab('scoreboard');
      };

      // Функция ЗАВЕРШЕНИЯ ИГРЫ
      const handleEndGame = () => {
        if (confirm('Вы уверены, что хотите завершить партию?')) {
          setGameStarted(false);
          setStrategyPicks({});
          setTurnOrder([]);
          setActiveTurnIdx(0);
          setPassed({});
        }
      };

      const addPlayer = () => {
        if (players.length >= 8) return;
        const newId = Date.now();
        const unassignedFaction = availableFactions.find(f => !players.some(p => p.factionId === f.id)) || availableFactions[0];
        setPlayers([...players, { id: newId, name: `Игрок ${players.length + 1}`, factionId: unassignedFaction.id, secrets: 0, extra: 0, breakthrough: false }]);
      };

      const removePlayer = (id) => {
        if (players.length <= 2) return;
        setPlayers(players.filter(p => p.id !== id));
      };

      const getPlayerScore = (playerId) => {
        const p = players.find(x => x.id === playerId);
        if (!p) return 0;
        let score = p.secrets + p.extra;
        objectives.forEach(obj => {
          if (completions[`${playerId}_${obj.id}`]) score += obj.points;
        });
        return score;
      };

      const toggleCompletion = (pId, oId) => {
        const key = `${pId}_${oId}`;
        setCompletions(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const addCustomObj = () => {
        const title = prompt('Введите название цели:');
        if (!title) return;
        const stage = prompt('Этап цели (1 или 2):', '1');
        const points = Number(stage) === 2 ? 2 : 1;
        setObjectives(prev => [...prev, { id: 'custom_' + Date.now(), title, stage: Number(stage), points, desc: 'Пользовательская цель' }]);
      };

      const startActionPhase = () => {
        const ordered = [...players]
          .filter(p => strategyPicks[p.id])
          .sort((a,b) => (strategyPicks[a.id] || 99) - (strategyPicks[b.id] || 99));

        if (ordered.length === 0) {
          alert('Выберите карты стратегий для игроков!');
          return;
        }
        setTurnOrder(ordered);
        setActiveTurnIdx(0);
        setPassed({});
      };

      const nextTurn = () => {
        if (turnOrder.length === 0) return;
        let next = (activeTurnIdx + 1) % turnOrder.length;
        let count = 0;
        while (passed[turnOrder[next].id] && count < turnOrder.length) {
          next = (next + 1) % turnOrder.length;
          count++;
        }
        setActiveTurnIdx(next);
      };

      const passTurn = (pId) => {
        setPassed(prev => ({ ...prev, [pId]: true }));
        nextTurn();
      };

      const activePlayer = turnOrder[activeTurnIdx];

      return (
        <div className="max-w-7xl mx-auto min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          {/* ХЕДЕР */}
          <header className="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30 shadow-xl">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <i className="fa-solid fa-khanda text-cyan-400 text-xl"></i>
                <span className="font-orbitron font-extrabold text-lg md:text-xl text-white tracking-wider">TI4 TRACKER</span>
              </div>

              {gameStarted ? (
                /* Навигация во время игры + Кнопка КОНЕЦ ИГРЫ */
                <div className="flex items-center gap-3">
                  <nav className="hidden md:flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                    <button onClick={() => setActiveTab('scoreboard')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'scoreboard' ? 'bg-cyan-500 text-black' : 'text-slate-400'}`}>
                      <i className="fa-solid fa-trophy mr-1"></i> Таблица ПО
                    </button>
                    <button onClick={() => setActiveTab('turns')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'turns' ? 'bg-cyan-500 text-black' : 'text-slate-400'}`}>
                      <i className="fa-solid fa-stopwatch mr-1"></i> Ходы & Стратегии
                    </button>
                    <button onClick={() => setActiveTab('objectives')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'objectives' ? 'bg-cyan-500 text-black' : 'text-slate-400'}`}>
                      <i className="fa-solid fa-list-check mr-1"></i> Задания
                    </button>
                  </nav>

                  <div className="text-xs font-extrabold bg-amber-950/80 text-amber-400 border border-amber-800 px-3 py-1.5 rounded-xl hidden sm:block">
                    Цель: {targetScore} ПО
                  </div>

                  <button 
                    onClick={handleEndGame} 
                    className="bg-red-950/80 hover:bg-red-900 text-red-300 font-extrabold px-3 py-1.5 rounded-xl text-xs border border-red-800 transition flex items-center gap-1 shadow">
                    <i className="fa-solid fa-flag-checkered"></i>
                    <span>Конец игры</span>
                  </button>
                </div>
              ) : (
                /* Хедер в режиме Настройки */
                <div className="text-xs font-bold text-cyan-400 uppercase tracking-widest bg-slate-950 px-3 py-1 rounded-lg border border-slate-800">
                  Экран Настройки
                </div>
              )}
            </div>

            {/* Очередность хода во время игры */}
            {gameStarted && turnOrder.length > 0 && activePlayer && (
              <div className="bg-slate-950 border border-cyan-500/50 p-3 rounded-2xl flex items-center justify-between mt-3 shadow-[0_0_15px_rgba(6,182,212,0.15)]">
                <div className="flex items-center gap-3">
                  {(() => {
                    const fact = ALL_FACTIONS.find(f => f.id === activePlayer.factionId);
                    return (
                      <div className="w-10 h-10 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center p-1 overflow-hidden shadow">
                        <img src={fact?.iconUrl} alt={fact?.name} className="w-full h-full object-contain" />
                      </div>
                    );
                  })()}
                  <div>
                    <div className="text-[10px] text-cyan-400 font-bold uppercase tracking-wider">Сейчас ходит:</div>
                    <div className="font-bold text-white text-base md:text-lg leading-none">{activePlayer.name}</div>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={nextTurn} className="bg-cyan-500 text-black font-extrabold px-4 py-1.5 rounded-xl text-xs md:text-sm flex items-center gap-1 shadow">
                    Завершить ход <i className="fa-solid fa-forward"></i>
                  </button>
                  <button onClick={() => passTurn(activePlayer.id)} className="bg-red-950 text-red-300 font-bold px-3 py-1.5 rounded-xl text-xs border border-red-800">
                    Пас
                  </button>
                </div>
              </div>
            )}
          </header>

          {/* КОНТЕНТ */}
          <main className="p-4 md:p-6 flex-grow space-y-6">

            {/* 1. ЭКРАН НАСТРОЙКИ (Показывается ДО нажатия "Старт игры") */}
            {!gameStarted && (
              <div className="max-w-4xl mx-auto space-y-6">
                
                {/* Настройка условий */}
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                  <h2 className="font-orbitron font-bold text-base text-amber-400 uppercase flex items-center gap-2">
                    <i className="fa-solid fa-sliders"></i> Параметры Партии
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    {/* Лимит ПО */}
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                      <label className="text-xs font-bold text-slate-400 uppercase">Цель Победных Очков (ПО):</label>
                      <div className="flex gap-2">
                        {[10, 12, 14].map(score => (
                          <button 
                            key={score}
                            onClick={() => setTargetScore(score)}
                            className={`flex-1 py-2 rounded-xl font-orbitron font-black text-sm border transition ${targetScore === score ? 'bg-amber-500 text-black border-amber-400 shadow-lg' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                            {score} ПО
                          </button>
                        ))}
                      </div>
                    </div>

                    {/* Дополнения */}
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                      <label className="text-xs font-bold text-slate-400 uppercase">Используемые Дополнения:</label>
                      <div className="flex gap-3">
                        <button 
                          onClick={() => setUsePok(!usePok)} 
                          className={`flex-1 py-2 px-3 rounded-xl font-bold text-xs border flex items-center justify-between transition ${usePok ? 'bg-purple-950 border-purple-500 text-purple-300' : 'bg-slate-900 border-slate-800 text-slate-600'}`}>
                          <span>Prophecy of Kings</span>
                          <i className={`fa-solid ${usePok ? 'fa-check-circle text-purple-400' : 'fa-circle text-slate-700'}`}></i>
                        </button>
                        <button 
                          onClick={() => setUseTe(!useTe)} 
                          className={`flex-1 py-2 px-3 rounded-xl font-bold text-xs border flex items-center justify-between transition ${useTe ? 'bg-amber-950 border-amber-500 text-amber-300' : 'bg-slate-900 border-slate-800 text-slate-600'}`}>
                          <span>Thunder's Edge</span>
                          <i className={`fa-solid ${useTe ? 'fa-check-circle text-amber-400' : 'fa-circle text-slate-700'}`}></i>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Выбор игроков и фракций */}
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="font-orbitron font-bold text-base text-cyan-400 uppercase flex items-center gap-2">
                      <i className="fa-solid fa-users"></i> Игроки и Фракции ({players.length})
                    </h2>
                    {players.length < 8 && (
                      <button onClick={addPlayer} className="bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 font-bold px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1">
                        <i className="fa-solid fa-user-plus"></i> Добавить игрока
                      </button>
                    )}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {players.map((p, idx) => {
                      const faction = ALL_FACTIONS.find(f => f.id === p.factionId);

                      return (
                        <div key={p.id} className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3 relative">
                          <div className="flex items-center justify-between gap-3">
                            <span className="font-orbitron font-bold text-xs text-slate-500">#{idx + 1}</span>
                            <input 
                              type="text" 
                              value={p.name} 
                              onChange={(e) => setPlayers(players.map(x => x.id === p.id ? {...x, name: e.target.value} : x))}
                              className="bg-slate-900 border border-slate-800 px-3 py-1 rounded-lg font-bold text-sm text-white focus:outline-none focus:border-cyan-400 flex-grow"
                            />
                            {players.length > 2 && (
                              <button onClick={() => removePlayer(p.id)} className="text-slate-600 hover:text-red-400 p-1 transition">
                                <i className="fa-solid fa-trash-can"></i>
                              </button>
                            )}
                          </div>

                          <div className="flex items-center gap-3 bg-slate-900 p-2 rounded-lg border border-slate-800">
                            <div className="w-10 h-10 rounded-lg bg-slate-950 border border-slate-800 flex items-center justify-center p-1 overflow-hidden flex-shrink-0">
                              <img src={faction?.iconUrl} alt={faction?.name} className="w-full h-full object-contain" />
                            </div>
                            <div className="flex-grow">
                              <div className="text-[10px] uppercase font-bold text-slate-500">Фракция:</div>
                              <select 
                                value={p.factionId} 
                                onChange={(e) => setPlayers(players.map(x => x.id === p.id ? {...x, factionId: e.target.value} : x))}
                                className="bg-transparent text-xs font-bold text-amber-400 focus:outline-none w-full">
                                {availableFactions.map(f => (
                                  <option key={f.id} value={f.id} className="bg-slate-900 text-white">{f.name}</option>
                                ))}
                              </select>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* КНОПКА СТАРТ ИГРЫ */}
                <button 
                  onClick={handleStartGame} 
                  className="w-full bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 text-black font-orbitron font-black text-lg py-4 rounded-2xl shadow-xl hover:opacity-95 transition transform active:scale-95 uppercase tracking-wider flex items-center justify-center gap-2">
                  <i className="fa-solid fa-play"></i> Старт игры
                </button>

              </div>
            )}

            {/* 2. ЭКРАН АКТИВНОЙ ИГРЫ (Отображается ПОСЛЕ нажатия "Старт игры") */}
            {gameStarted && (
              <>
                {/* Таблица ПО */}
                {activeTab === 'scoreboard' && (
                  <div className="space-y-4">
                    <h2 className="font-orbitron font-bold text-base text-white uppercase">Текущий Счёт Игроков</h2>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      {players.map(p => {
                        const score = getPlayerScore(p.id);
                        const faction = ALL_FACTIONS.find(f => f.id === p.factionId);
                        const isWinner = score >= targetScore;

                        return (
                          <div key={p.id} className={`p-4 rounded-2xl border flex flex-col justify-between space-y-3 ${isWinner ? 'bg-amber-950/40 border-amber-500 animate-pulse' : 'bg-slate-900 border-slate-800'}`}>
                            
                            <div className="flex items-start gap-3">
                              <div className="w-16 h-16 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-center p-1 flex-shrink-0 shadow-inner overflow-hidden" style={{ borderColor: `${faction?.color}aa` }}>
                                <img src={faction?.iconUrl} alt={faction?.name} className="w-full h-full object-contain" />
                              </div>

                              <div className="flex-grow">
                                <div className="flex items-center justify-between">
                                  <div className="font-bold text-lg text-white truncate max-w-[120px]">{p.name}</div>
                                  <div className={`font-orbitron font-black text-xl px-2.5 py-0.5 rounded-xl ${isWinner ? 'bg-amber-500 text-black' : 'bg-slate-950 text-cyan-400 border border-slate-800'}`}>
                                    {score} ПО
                                  </div>
                                </div>

                                <div className="text-xs font-bold text-slate-400 mt-1 truncate">
                                  {faction?.name}
                                </div>
                              </div>
                            </div>

                            {/* Прорыв TE */}
                            {useTe && (
                              <div className="flex items-center justify-between bg-amber-950/20 p-2 rounded-xl border border-amber-900/30 text-xs">
                                <span className="text-amber-300 font-bold">⚡ Прорыв (TE):</span>
                                <button 
                                  onClick={() => setPlayers(players.map(x => x.id === p.id ? {...x, breakthrough: !x.breakthrough} : x))}
                                  className={`px-2 py-0.5 rounded font-bold transition ${p.breakthrough ? 'bg-amber-500 text-black' : 'bg-slate-800 text-slate-400'}`}>
                                  {p.breakthrough ? 'АКТИВЕН' : 'НЕТ'}
                                </button>
                              </div>
                            )}

                            {/* Секретки и Мекатол */}
                            <div className="flex items-center justify-between text-xs text-slate-400 border-t border-slate-800/80 pt-2">
                              <div>Секретки: <span className="text-amber-400 font-bold">{p.secrets}</span> 
                                <button onClick={() => setPlayers(players.map(x => x.id === p.id ? {...x, secrets: x.secrets + 1} : x))} className="ml-1 px-1.5 py-0.5 bg-slate-800 rounded text-cyan-400 font-bold">+</button>
                              </div>
                              <div>Мекатол/Реликвии: <span className="text-purple-400 font-bold">{p.extra}</span>
                                <button onClick={() => setPlayers(players.map(x => x.id === p.id ? {...x, extra: x.extra + 1} : x))} className="ml-1 px-1.5 py-0.5 bg-slate-800 rounded text-cyan-400 font-bold">+</button>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                )}

                {/* Ходы & Стратегии */}
                {activeTab === 'turns' && (
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div className="md:col-span-2 bg-slate-900 border border-slate-800 p-4 md:p-6 rounded-2xl space-y-4">
                      <div className="flex items-center justify-between">
                        <h2 className="font-orbitron font-bold text-sm md:text-base text-amber-400 uppercase">1. Выбор Карт Стратегий</h2>
                        <button onClick={startActionPhase} className="bg-amber-500 text-black font-extrabold px-4 py-2 rounded-xl text-xs md:text-sm shadow">
                          Старт Фазы Ходов
                        </button>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        {STRATEGY_CARDS.map(card => {
                          const pickedPlayerId = Object.keys(strategyPicks).find(pId => strategyPicks[pId] === card.id);

                          return (
                            <div key={card.id} className={`p-3 rounded-xl border flex flex-col justify-between h-28 ${card.color}`}>
                              <div className="font-orbitron font-extrabold text-xs md:text-sm mb-1">{card.name}</div>
                              <select 
                                value={pickedPlayerId || ''} 
                                onChange={(e) => {
                                  const pId = Number(e.target.value);
                                  setStrategyPicks(prev => ({ ...prev, [pId]: card.id }));
                                }}
                                className="bg-black/60 text-[11px] font-bold p-1.5 rounded border border-white/20 text-white focus:outline-none">
                                <option value="">-- Чья карта --</option>
                                {players.map(p => (
                                  <option key={p.id} value={p.id}>{p.name}</option>
                                ))}
                              </select>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className="bg-slate-900 border border-slate-800 p-4 md:p-6 rounded-2xl space-y-3">
                      <h2 className="font-orbitron font-bold text-sm md:text-base text-cyan-400 uppercase mb-2">2. Очередность Хода</h2>
                      {turnOrder.length === 0 ? (
                        <div className="text-xs text-slate-500 italic">Выберите карты стратегий и нажмите «Старт Фазы Ходов»</div>
                      ) : (
                        turnOrder.map((p, idx) => {
                          const isActive = idx === activeTurnIdx;
                          const isPassed = passed[p.id];
                          const card = STRATEGY_CARDS.find(c => c.id === strategyPicks[p.id]);
                          const fact = ALL_FACTIONS.find(f => f.id === p.factionId);

                          return (
                            <div key={p.id} className={`p-3 rounded-xl border flex items-center justify-between ${isActive ? 'bg-cyan-950/60 border-cyan-400 shadow-md' : isPassed ? 'opacity-40 bg-slate-950 border-slate-900' : 'bg-slate-950 border-slate-800'}`}>
                              <div className="flex items-center gap-3">
                                <span className="font-orbitron font-bold text-xs text-slate-500">#{idx + 1}</span>
                                <div className="w-8 h-8 rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center p-0.5 overflow-hidden">
                                  <img src={fact?.iconUrl} alt={fact?.name} className="w-full h-full object-contain" />
                                </div>
                                <div>
                                  <div className="font-bold text-sm text-white">{p.name} {isActive && <span className="text-[9px] bg-cyan-500 text-black px-1 rounded font-extrabold ml-1">ХОД</span>}</div>
                                  <div className="text-[11px] text-slate-400">{card?.name || 'Нет карты'}</div>
                                </div>
                              </div>
                              <span className="text-xs font-bold text-amber-400 bg-slate-900 px-2 py-1 rounded border border-slate-800">
                                Ин. {card?.initiative}
                              </span>
                            </div>
                          );
                        })
                      )}
                    </div>
                  </div>
                )}

                {/* Задания */}
                {activeTab === 'objectives' && (
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <h2 className="font-orbitron font-bold text-base text-white">Открытые Публичные Задания</h2>
                      <button onClick={addCustomObj} className="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1 shadow">
                        <i className="fa-solid fa-plus"></i> Добавить цель
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                      {objectives.map(obj => (
                        <div key={obj.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg flex flex-col justify-between">
                          <div>
                            <div className="flex items-center justify-between mb-2">
                              <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded ${obj.stage === 2 ? 'bg-red-950 text-red-400 border border-red-800' : 'bg-blue-950 text-blue-400 border border-blue-800'}`}>
                                Этап {obj.stage} ({obj.points} ПО)
                              </span>
                            </div>
                            <h3 className="font-bold text-base text-white">{obj.title}</h3>
                            <p className="text-xs text-slate-400 mt-1">{obj.desc}</p>
                          </div>

                          <div className="border-t border-slate-800/80 pt-3">
                            <div className="text-[11px] font-bold text-slate-400 mb-2 uppercase">Кто выполнил:</div>
                            <div className="grid grid-cols-2 gap-2">
                              {players.map(p => {
                                const isDone = !!completions[`${p.id}_${obj.id}`];
                                const faction = ALL_FACTIONS.find(f => f.id === p.factionId);

                                return (
                                  <button
                                    key={p.id}
                                    onClick={() => toggleCompletion(p.id, obj.id)}
                                    className={`p-2 rounded-xl border text-xs font-bold flex items-center justify-between transition ${isDone ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                                    <div className="flex items-center gap-2 truncate">
                                      <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: faction?.color }}></span>
                                      <span className="truncate">{p.name}</span>
                                    </div>
                                    <i className={`fa-solid ${isDone ? 'fa-square-check text-cyan-400 text-sm' : 'fa-square text-slate-700 text-sm'}`}></i>
                                  </button>
                                );
                              })}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
              </>
            )}

          </main>

          {/* МОБИЛЬНОЕ МЕНЮ (Только во время игры) */}
          {gameStarted && (
            <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-2 flex justify-around z-40">
              <button 
                onClick={() => setActiveTab('scoreboard')} 
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-[11px] font-bold transition ${activeTab === 'scoreboard' ? 'text-cyan-400' : 'text-slate-400'}`}>
                <i className="fa-solid fa-trophy text-base"></i>
                <span>Счет</span>
              </button>
              <button 
                onClick={() => setActiveTab('turns')} 
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-[11px] font-bold transition ${activeTab === 'turns' ? 'text-cyan-400' : 'text-slate-400'}`}>
                <i className="fa-solid fa-stopwatch text-base"></i>
                <span>Ходы</span>
              </button>
              <button 
                onClick={() => setActiveTab('objectives')} 
                className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-[11px] font-bold transition ${activeTab === 'objectives' ? 'text-cyan-400' : 'text-slate-400'}`}>
                <i className="fa-solid fa-list-check text-base"></i>
                <span>Задания</span>
              </button>
            </nav>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
