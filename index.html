<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TI4 Companion - Emblem Edition</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen pb-20 md:pb-10">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Графические SVG-гербы для фракций
    const FACTION_EMBLEMS = {
      sol: (color) => (
        <svg viewBox="0 0 100 100" className="w-full h-full p-1" style={{ filter: `drop-shadow(0 0 6px ${color}88)` }}>
          <circle cx="50" cy="50" r="28" fill="none" stroke={color} strokeWidth="6" />
          <path d="M50 5 L50 18 M50 82 L50 95 M5 50 L18 50 M82 50 L95 50 M18 18 L27 27 M73 73 L82 82 M18 82 L27 73 M73 27 L82 18" stroke={color} strokeWidth="5" strokeLinecap="round" />
        </svg>
      ),
      jolnar: (color) => (
        <svg viewBox="0 0 100 100" className="w-full h-full p-1" style={{ filter: `drop-shadow(0 0 6px ${color}88)` }}>
          <path d="M50 10 L85 30 L85 70 L50 90 L15 70 L15 30 Z" fill="none" stroke={color} strokeWidth="5" />
          <circle cx="50" cy="50" r="14" fill={color} />
          <path d="M50 25 L50 36 M50 64 L50 75 M28 50 L36 50 M64 50 L72 50" stroke={color} strokeWidth="4" />
        </svg>
      ),
      hacan: (color) => (
        <svg viewBox="0 0 100 100" className="w-full h-full p-1" style={{ filter: `drop-shadow(0 0 6px ${color}88)` }}>
          <polygon points="50,10 90,40 75,85 25,85 10,40" fill="none" stroke={color} strokeWidth="5" />
          <path d="M35 40 L50 25 L65 40 L50 70 Z" fill={color} />
        </svg>
      ),
      nekro: (color) => (
        <svg viewBox="0 0 100 100" className="w-full h-full p-1" style={{ filter: `drop-shadow(0 0 6px ${color}88)` }}>
          <path d="M50 10 L80 25 L80 60 L50 90 L20 60 L20 25 Z" fill="none" stroke={color} strokeWidth="5" />
          <circle cx="38" cy="42" r="7" fill={color} />
          <circle cx="62" cy="42" r="7" fill={color} />
          <path d="M42 65 L50 58 L58 65 L54 75 L46 75 Z" fill={color} />
        </svg>
      ),
      xxcha: (color) => (
        <svg viewBox="0 0 100 100" className="w-full h-full p-1" style={{ filter: `drop-shadow(0 0 6px ${color}88)` }}>
          <path d="M50 10 C 20 10, 10 30, 10 50 C 10 80, 50 90, 50 90 C 50 90, 90 80, 90 50 C 90 30, 80 10, 50 10 Z" fill="none" stroke={color} strokeWidth="5" />
          <circle cx="50" cy="45" r="16" fill="none" stroke={color} strokeWidth="4" />
        </svg>
      ),
      default: (color) => (
        <svg viewBox="0 0 100 100" className="w-full h-full p-1" style={{ filter: `drop-shadow(0 0 6px ${color}88)` }}>
          <polygon points="50,10 90,50 50,90 10,50" fill="none" stroke={color} strokeWidth="5" />
          <circle cx="50" cy="50" r="10" fill={color} />
        </svg>
      )
    };

    const ALL_FACTIONS = [
      { id: 'sol', name: 'Федерация Сол', color: '#3b82f6', exp: 'base' },
      { id: 'jolnar', name: 'Университеты Джол-Нара', color: '#06b6d4', exp: 'base' },
      { id: 'hacan', name: 'Эмират Хакан', color: '#eab308', exp: 'base' },
      { id: 'xxcha', name: 'Королевство Ззча', color: '#22c55e', exp: 'base' },
      { id: 'nekro', name: 'Вирус Некро', color: '#ef4444', exp: 'base' },
      { id: 'saar', name: 'Кланы Сааров', color: '#a855f7', exp: 'base' },
      { id: 'l1z1x', name: 'Иерархия L1Z1X', color: '#64748b', exp: 'base' },
      { id: 'letnev', name: 'Баронат Летнев', color: '#475569', exp: 'base' },
      
      // PoK
      { id: 'argent', name: 'Летный Альянс Аргентов', color: '#facc15', exp: 'pok' },
      { id: 'mahact', name: 'Генетическая Империя Махакт', color: '#fbbf24', exp: 'pok' },
      { id: 'titans', name: 'Титаны Ула', color: '#a1a1aa', exp: 'pok' },
      
      // TE (Thunder's Edge)
      { id: 'keleres', name: 'Совет Келерес', color: '#38bdf8', exp: 'te' },
      { id: 'vaefar', name: 'Завет Ваэфар', color: '#c084fc', exp: 'te' }
    ];

    const STRATEGY_CARDS = [
      { id: 1, name: '1. Величие', initiative: 1, color: 'border-red-500 bg-red-950/40 text-red-300' },
      { id: 2, name: '2. Дипломатия', initiative: 2, color: 'border-amber-500 bg-amber-950/40 text-amber-300' },
      { id: 3, name: '3. Политика', initiative: 3, color: 'border-yellow-500 bg-yellow-950/40 text-yellow-300' },
      { id: 4, name: '4. Строительство', initiative: 4, color: 'border-emerald-500 bg-emerald-950/40 text-emerald-300' },
      { id: 5, name: '5. Торговля', initiative: 5, color: 'border-teal-500 bg-teal-950/40 text-teal-300' },
      { id: 6, name: '6. Война', initiative: 6, color: 'border-cyan-500 bg-cyan-950/40 text-cyan-300' },
      { id: 7, name: '7. Технологии', initiative: 7, color: 'border-blue-500 bg-blue-950/40 text-blue-300' },
      { id: 8, name: '8. Экспансия', initiative: 8, color: 'border-purple-500 bg-purple-950/40 text-purple-300' }
    ];

    function App() {
      const [targetScore, setTargetScore] = useState(10);
      const [activeTab, setActiveTab] = useState('scoreboard');
      const [usePok, setUsePok] = useState(true);
      const [useTe, setUseTe] = useState(true);

      const [players, setPlayers] = useState([
        { id: 1, name: 'Игрок 1', factionId: 'sol', secrets: 0, extra: 0, breakthrough: false },
        { id: 2, name: 'Игрок 2', factionId: 'jolnar', secrets: 0, extra: 0, breakthrough: false },
        { id: 3, name: 'Игрок 3', factionId: 'nekro', secrets: 0, extra: 0, breakthrough: true },
        { id: 4, name: 'Игрок 4', factionId: 'hacan', secrets: 0, extra: 0, breakthrough: false },
      ]);

      const availableFactions = ALL_FACTIONS.filter(f => {
        if (f.exp === 'base') return true;
        if (f.exp === 'pok' && usePok) return true;
        if (f.exp === 'te' && useTe) return true;
        return false;
      });

      const renderEmblem = (factionId, color) => {
        const renderFn = FACTION_EMBLEMS[factionId] || FACTION_EMBLEMS.default;
        return renderFn(color);
      };

      return (
        <div className="max-w-7xl mx-auto min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          <header className="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30 shadow-xl flex items-center justify-between">
            <div className="flex items-center gap-3">
              <i className="fa-solid fa-khanda text-cyan-400 text-xl"></i>
              <span className="font-orbitron font-extrabold text-lg md:text-xl text-white tracking-wider">TI4 TRACKER</span>
            </div>

            <div className="flex items-center gap-2">
              <button 
                onClick={() => setUsePok(!usePok)} 
                className={`text-[11px] font-bold px-2 py-1 rounded-lg border transition ${usePok ? 'bg-purple-950 border-purple-500 text-purple-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>
                PoK
              </button>
              <button 
                onClick={() => setUseTe(!useTe)} 
                className={`text-[11px] font-bold px-2 py-1 rounded-lg border transition ${useTe ? 'bg-amber-950 border-amber-500 text-amber-300' : 'bg-slate-800 border-slate-700 text-slate-500'}`}>
                TE
              </button>
            </div>
          </header>

          <main className="p-4 md:p-6 flex-grow space-y-6">

            <div className="space-y-4">
              <h2 className="font-orbitron font-bold text-base text-white">Игроки и Графические Гербы</h2>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-2 gap-4">
                {players.map(p => {
                  const faction = ALL_FACTIONS.find(f => f.id === p.factionId);

                  return (
                    <div key={p.id} className="p-4 rounded-2xl border bg-slate-900 border-slate-800 flex items-start gap-4">
                      
                      {/* Графический векторный герб */}
                      <div className="w-16 h-16 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-center p-1 flex-shrink-0">
                        {renderEmblem(p.factionId, faction?.color || '#3b82f6')}
                      </div>

                      <div className="flex-grow space-y-2">
                        <div className="flex items-center justify-between">
                          <input 
                            type="text" 
                            value={p.name} 
                            onChange={(e) => setPlayers(players.map(x => x.id === p.id ? {...x, name: e.target.value} : x))}
                            className="bg-transparent font-bold text-lg text-white focus:outline-none focus:border-b border-cyan-400 w-32"
                          />
                          <div className="font-orbitron font-black text-xl px-3 py-1 rounded-xl bg-slate-950 text-cyan-400 border border-slate-800">
                            0 ПО
                          </div>
                        </div>

                        {/* Выбор Фракции */}
                        <div className="bg-slate-950 p-2 rounded-xl border border-slate-800 flex items-center justify-between">
                          <span className="text-[10px] uppercase font-bold text-slate-500">Фракция:</span>
                          <select 
                            value={p.factionId} 
                            onChange={(e) => setPlayers(players.map(x => x.id === p.id ? {...x, factionId: e.target.value} : x))}
                            className="bg-transparent text-xs font-bold text-slate-200 focus:outline-none text-right">
                            {availableFactions.map(f => (
                              <option key={f.id} value={f.id} className="bg-slate-900 text-white">{f.name}</option>
                            ))}
                          </select>
                        </div>

                        {/* Переключатель Прорыва (Breakthrough) */}
                        {useTe && (
                          <div className="flex items-center justify-between bg-amber-950/20 p-2 rounded-xl border border-amber-900/30 text-xs">
                            <span className="text-amber-300 font-bold">⚡ Прорыв (TE):</span>
                            <button 
                              onClick={() => setPlayers(players.map(x => x.id === p.id ? {...x, breakthrough: !x.breakthrough} : x))}
                              className={`px-2 py-0.5 rounded font-bold transition ${p.breakthrough ? 'bg-amber-500 text-black' : 'bg-slate-800 text-slate-400'}`}>
                              {p.breakthrough ? 'АКТИВЕН' : 'НЕТ'}
                            </button>
                          </div>
                        )}
                      </div>

                    </div>
                  );
                })}
              </div>
            </div>

          </main>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
