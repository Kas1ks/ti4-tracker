<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TI4 Companion - Epic Edition</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
    }
    .font-orbitron { font-family: 'Orbitron', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0b0f19; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen pb-20 md:pb-10">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Расширенный список фракций (База + Prophecy of Kings)
    const ALL_FACTIONS = [
      // Базовая игра
      { id: 'sol', name: 'Федерация Сол', icon: 'fa-sun', color: '#3b82f6', pok: false },
      { id: 'jolnar', name: 'Университеты Джол-Нара', icon: 'fa-flask', color: '#06b6d4', pok: false },
      { id: 'hacan', name: 'Эмират Хакан', icon: 'fa-coins', color: '#eab308', pok: false },
      { id: 'xxcha', name: 'Королевство Ззча', icon: 'fa-shield-halved', color: '#22c55e', pok: false },
      { id: 'nekro', name: 'Вирус Некро', icon: 'fa-skull', color: '#ef4444', pok: false },
      { id: 'saar', name: 'Кланы Сааров', icon: 'fa-meteor', color: '#a855f7', pok: false },
      { id: 'l1z1x', name: 'Иерархия L1Z1X', icon: 'fa-robot', color: '#64748b', pok: false },
      { id: 'letnev', name: 'Баронат Летнев', icon: 'fa-chess-knight', color: '#475569', pok: false },
      { id: 'arborec', name: 'Древостой Арбореков', icon: 'fa-tree', color: '#15803d', pok: false },
      { id: 'creuss', name: 'Призраки Крёсса', icon: 'fa-ghost', color: '#38bdf8', pok: false },
      { id: 'mentak', name: 'Коалиция Ментака', icon: 'fa-skull-crossbones', color: '#f97316', pok: false },
      { id: 'muaat', name: 'Уполномоченные Муаата', icon: 'fa-fire', color: '#dc2626', pok: false },
      { id: 'naalu', name: 'Валлиада Наалу', icon: 'fa-eye', color: '#84cc16', pok: false },
      { id: 'saardakk', name: 'Сардакк Ноур', icon: 'fa-bug', color: '#991b1b', pok: false },
      { id: 'yin', name: 'Братство Инь', icon: 'fa-dna', color: '#e2e8f0', pok: false },
      { id: 'yssaril', name: 'Племена Иссарилов', icon: 'fa-user-ninja', color: '#166534', pok: false },

      // Prophecy of Kings (PoK)
      { id: 'argent', name: 'Летный Альянс Аргентов', icon: 'fa-feather-pointed', color: '#facc15', pok: true },
      { id: 'empyrean', name: 'Эмпиреи', icon: 'fa-infinity', color: '#818cf8', pok: true },
      { id: 'mahact', name: 'Генетическая Империя Махакт', icon: 'fa-crown', color: '#fbbf24', pok: true },
      { id: 'naazrokha', name: 'Альянс Нааз-Роха', icon: 'fa-handshake', color: '#10b981', pok: true },
      { id: 'nomad', name: 'Кочевник (Nomad)', icon: 'fa-compass', color: '#f43f5e', pok: true },
      { id: 'titans', name: 'Титаны Ула', icon: 'fa-monument', color: '#a1a1aa', pok: true },
      { id: 'vuilraith', name: 'Кабала Вуил’Райт', icon: 'fa-spaghetti-monster-flying', color: '#b91c1c', pok: true }
    ];

    const STRATEGY_CARDS = [
      { id: 1, name: '1. Величие', initiative: 1, color: 'border-red-500 bg-red-950/40 text-red-300' },
      { id: 2, name: '2. Дипломатия', initiative: 2, color: 'border-amber-500 bg-amber-950/40 text-amber-300' },
      { id: 3, name: '3. Политика', initiative: 3, color: 'border-yellow-500 bg-yellow-950/40 text-yellow-300' },
      { id: 4, name: '4. Строительство', initiative: 4, color: 'border-emerald-500 bg-emerald-950/40 text-emerald-300' },
      { id: 5, name: '5. Торговля', initiative: 5, color: 'border-teal-500 bg-teal-950/40 text-teal-300' },
      { id: 6, name: '6. Война', initiative: 6, color: 'border-cyan-500 bg-cyan-950/40 text-cyan-300' },
      { id: 7, name: '7. Технологии', initiative: 7, color: 'border-blue-500 bg-blue-950/40 text-blue-300' },
      { id: 8, name: '8. Экспансия', initiative: 8, color: 'border-purple-500 bg-purple-950/40 text-purple-300' }
    ];

    const DEFAULT_OBJECTIVES = [
      { id: 'obj_1', title: 'Укрепить границы', stage: 1, points: 1, desc: 'Иметь сооружения на 2 планетах вне родной системы' },
      { id: 'obj_2', title: 'Расширить владения', stage: 1, points: 1, desc: 'Контролировать 6 планет вне родной системы' }
    ];

    function App() {
      const [targetScore, setTargetScore] = useState(10);
      const [currentRound, setCurrentRound] = useState(1);
      const [activeTab, setActiveTab] = useState('turns');
      const [usePok, setUsePok] = useState(true);

      const [players, setPlayers] = useState([
        { id: 1, name: 'Игрок 1', factionId: 'sol', secrets: 0, extra: 0 },
        { id: 2, name: 'Игрок 2', factionId: 'jolnar', secrets: 0, extra: 0 },
        { id: 3, name: 'Игрок 3', factionId: 'hacan', secrets: 0, extra: 0 },
        { id: 4, name: 'Игрок 4', factionId: 'xxcha', secrets: 0, extra: 0 },
        { id: 5, name: 'Игрок 5', factionId: 'nekro', secrets: 0, extra: 0 },
        { id: 6, name: 'Игрок 6', factionId: 'saar', secrets: 0, extra: 0 },
      ]);

      const [objectives, setObjectives] = useState(DEFAULT_OBJECTIVES);
      const [completions, setCompletions] = useState({});
      
      const [strategyPicks, setStrategyPicks] = useState({});
      const [turnOrder, setTurnOrder] = useState([]);
      const [activeTurnIdx, setActiveTurnIdx] = useState(0);
      const [passed, setPassed] = useState({});

      const availableFactions = ALL_FACTIONS.filter(f => usePok || !f.pok);

      const getPlayerScore = (playerId) => {
        const p = players.find(x => x.id === playerId);
        if (!p) return 0;
        let score = p.secrets + p.extra;
        objectives.forEach(obj => {
          if (completions[`${playerId}_${obj.id}`]) score += obj.points;
        });
        return score;
      };

      const toggleCompletion = (pId, oId) => {
        const key = `${pId}_${oId}`;
        setCompletions(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const addCustomObj = () => {
        const title = prompt('Введите название цели:');
        if (!title) return;
        const stage = prompt('Этап цели (1 или 2):', '1');
        const points = Number(stage) === 2 ? 2 : 1;
        setObjectives(prev => [...prev, { id: 'custom_' + Date.now(), title, stage: Number(stage), points, desc: 'Пользовательская цель' }]);
      };

      const startActionPhase = () => {
        const ordered = [...players]
          .filter(p => strategyPicks[p.id])
          .sort((a,b) => (strategyPicks[a.id] || 99) - (strategyPicks[b.id] || 99));

        if (ordered.length === 0) {
          alert('Выберите карты стратегий для игроков!');
          return;
        }
        setTurnOrder(ordered);
        setActiveTurnIdx(0);
        setPassed({});
      };

      const nextTurn = () => {
        if (turnOrder.length === 0) return;
        let next = (activeTurnIdx + 1) % turnOrder.length;
        let count = 0;
        while (passed[turnOrder[next].id] && count < turnOrder.length) {
          next = (next + 1) % turnOrder.length;
          count++;
        }
        setActiveTurnIdx(next);
      };

      const passTurn = (pId) => {
        setPassed(prev => ({ ...prev, [pId]: true }));
        nextTurn();
      };

      const activePlayer = turnOrder[activeTurnIdx];

      return (
        <div className="max-w-7xl mx-auto min-h-screen flex flex-col bg-slate-950 text-slate-100">
          
          <header className="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30 shadow-xl">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <i className="fa-solid fa-khanda text-cyan-400 text-xl"></i>
                <span className="font-orbitron font-extrabold text-lg md:text-xl text-white tracking-wider">TI4 TRACKER</span>
              </div>

              <nav className="hidden md:flex bg-slate-950 p-1 rounded-xl border border-slate-800">
                <button onClick={() => setActiveTab('turns')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'turns' ? 'bg-cyan-500 text-black' : 'text-slate-400'}`}>
                  <i className="fa-solid fa-stopwatch mr-1"></i> Ходы & Стратегии
                </button>
                <button onClick={() => setActiveTab('objectives')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'objectives' ? 'bg-cyan-500 text-black' : 'text-slate-400'}`}>
                  <i className="fa-solid fa-list-check mr-1"></i> Задания
                </button>
                <button onClick={() => setActiveTab('scoreboard')} className={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${activeTab === 'scoreboard' ? 'bg-cyan-500 text-black' : 'text-slate-400'}`}>
                  <i className="fa-solid fa-trophy mr-1"></i> Таблица ПО
                </button>
              </nav>

              <div className="flex items-center gap-2">
                <button 
                  onClick={() => setUsePok(!usePok)} 
                  className={`text-xs font-bold px-2.5 py-1 rounded-full border transition ${usePok ? 'bg-purple-950 border-purple-500 text-purple-300' : 'bg-slate-800 border-slate-700 text-slate-400'}`}>
                  PoK: {usePok ? 'ВКЛ' : 'ВЫКЛ'}
                </button>
                <select 
                  value={targetScore} 
                  onChange={(e) => setTargetScore(Number(e.target.value))}
                  className="bg-slate-800 border border-slate-700 text-xs font-bold px-2 py-1 rounded-lg text-amber-400 focus:outline-none">
                  <option value={10}>10 ПО</option>
                  <option value={12}>12 ПО</option>
                  <option value={14}>14 ПО</option>
                </select>
              </div>
            </div>

            {turnOrder.length > 0 && activePlayer && (
              <div className="bg-slate-950 border border-cyan-500/50 p-3 rounded-2xl flex items-center justify-between mt-3 shadow-[0_0_15px_rgba(6,182,212,0.15)]">
                <div className="flex items-center gap-3">
                  {(() => {
                    const fact = ALL_FACTIONS.find(f => f.id === activePlayer.factionId);
                    return (
                      <div className="w-8 h-8 rounded-xl flex items-center justify-center text-sm shadow border border-white/10" style={{ backgroundColor: fact?.color }}>
                        <i className={`fa-solid ${fact?.icon} text-slate-950`}></i>
                      </div>
                    );
                  })()}
                  <div>
                    <div className="text-[10px] text-cyan-400 font-bold uppercase tracking-wider">Сейчас ходит:</div>
                    <div className="font-bold text-white text-base md:text-lg leading-none">{activePlayer.name}</div>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button onClick={nextTurn} className="bg-cyan-500 text-black font-extrabold px-4 py-1.5 rounded-xl text-xs md:text-sm flex items-center gap-1 shadow">
                    Завершить ход <i className="fa-solid fa-forward"></i>
                  </button>
                  <button onClick={() => passTurn(activePlayer.id)} className="bg-red-950 text-red-300 font-bold px-3 py-1.5 rounded-xl text-xs border border-red-800">
                    Пас
                  </button>
                </div>
              </div>
            )}
          </header>

          <main className="p-4 md:p-6 flex-grow space-y-6">

            {activeTab === 'turns' && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="md:col-span-2 bg-slate-900 border border-slate-800 p-4 md:p-6 rounded-2xl space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="font-orbitron font-bold text-sm md:text-base text-amber-400 uppercase">1. Выбор Карт Стратегий</h2>
                    <button onClick={startActionPhase} className="bg-amber-500 text-black font-extrabold px-4 py-2 rounded-xl text-xs md:text-sm shadow">
                      Старт Фазы Ходов
                    </button>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    {STRATEGY_CARDS.map(card => {
                      const pickedPlayerId = Object.keys(strategyPicks).find(pId => strategyPicks[pId] === card.id);

                      return (
                        <div key={card.id} className={`p-3 rounded-xl border flex flex-col justify-between h-28 ${card.color}`}>
                          <div className="font-orbitron font-extrabold text-xs md:text-sm mb-1">{card.name}</div>
                          <select 
                            value={pickedPlayerId || ''} 
                            onChange={(e) => {
                              const pId = Number(e.target.value);
                              setStrategyPicks(prev => ({ ...prev, [pId]: card.id }));
                            }}
                            className="bg-black/60 text-[11px] font-bold p-1.5 rounded border border-white/20 text-white focus:outline-none">
                            <option value="">-- Чья карта --</option>
                            {players.map(p => (
                              <option key={p.id} value={p.id}>{p.name}</option>
                            ))}
                          </select>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="bg-slate-900 border border-slate-800 p-4 md:p-6 rounded-2xl space-y-3">
                  <h2 className="font-orbitron font-bold text-sm md:text-base text-cyan-400 uppercase mb-2">2. Очередность Хода</h2>
                  {turnOrder.length === 0 ? (
                    <div className="text-xs text-slate-500 italic">Выберите карты стратегий и нажмите «Старт Фазы Ходов»</div>
                  ) : (
                    turnOrder.map((p, idx) => {
                      const isActive = idx === activeTurnIdx;
                      const isPassed = passed[p.id];
                      const card = STRATEGY_CARDS.find(c => c.id === strategyPicks[p.id]);
                      const fact = ALL_FACTIONS.find(f => f.id === p.factionId);

                      return (
                        <div key={p.id} className={`p-3 rounded-xl border flex items-center justify-between ${isActive ? 'bg-cyan-950/60 border-cyan-400 shadow-md' : isPassed ? 'opacity-40 bg-slate-950 border-slate-900' : 'bg-slate-950 border-slate-800'}`}>
                          <div className="flex items-center gap-3">
                            <span className="font-orbitron font-bold text-xs text-slate-500">#{idx + 1}</span>
                            <div className="w-6 h-6 rounded-lg flex items-center justify-center text-xs" style={{ backgroundColor: fact?.color }}>
                              <i className={`fa-solid ${fact?.icon} text-slate-950`}></i>
                            </div>
                            <div>
                              <div className="font-bold text-sm text-white">{p.name} {isActive && <span className="text-[9px] bg-cyan-500 text-black px-1 rounded font-extrabold ml-1">ХОД</span>}</div>
                              <div className="text-[11px] text-slate-400">{card?.name || 'Нет карты'}</div>
                            </div>
                          </div>
                          <span className="text-xs font-bold text-amber-400 bg-slate-900 px-2 py-1 rounded border border-slate-800">
                            Ин. {card?.initiative}
                          </span>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            )}

            {activeTab === 'objectives' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="font-orbitron font-bold text-base text-white">Открытые Публичные Задания</h2>
                  <button onClick={addCustomObj} className="bg-blue-600 text-white font-bold px-4 py-2 rounded-xl text-xs flex items-center gap-1 shadow">
                    <i className="fa-solid fa-plus"></i> Добавить цель
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {objectives.map(obj => (
                    <div key={obj.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between mb-2">
                          <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded ${obj.stage === 2 ? 'bg-red-950 text-red-400 border border-red-800' : 'bg-blue-950 text-blue-400 border border-blue-800'}`}>
                            Этап {obj.stage} ({obj.points} ПО)
                          </span>
                        </div>
                        <h3 className="font-bold text-base text-white">{obj.title}</h3>
                        <p className="text-xs text-slate-400 mt-1">{obj.desc}</p>
                      </div>

                      <div className="border-t border-slate-800/80 pt-3">
                        <div className="text-[11px] font-bold text-slate-400 mb-2 uppercase">Кто выполнил:</div>
                        <div className="grid grid-cols-2 gap-2">
                          {players.map(p => {
                            const isDone = !!completions[`${p.id}_${obj.id}`];
                            const faction = ALL_FACTIONS.find(f => f.id === p.factionId);

                            return (
                              <button
                                key={p.id}
                                onClick={() => toggleCompletion(p.id, obj.id)}
                                className={`p-2 rounded-xl border text-xs font-bold flex items-center justify-between transition ${isDone ? 'bg-cyan-500/20 border-cyan-400 text-cyan-300' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                                <div className="flex items-center gap-2 truncate">
                                  <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ backgroundColor: faction?.color }}></span>
                                  <span className="truncate">{p.name}</span>
                                </div>
                                <i className={`fa-solid ${isDone ? 'fa-square-check text-cyan-400 text-sm' : 'fa-square text-slate-700 text-sm'}`}></i>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'scoreboard' && (
              <div className="space-y-4">
                <h2 className="font-orbitron font-bold text-base text-white">Игроки и Фракции</h2>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {players.map(p => {
                    const score = getPlayerScore(p.id);
                    const faction = ALL_FACTIONS.find(f => f.id === p.factionId);
                    const isWinner = score >= targetScore;

                    return (
                      <div key={p.id} className={`p-4 rounded-2xl border flex flex-col justify-between space-y-3 ${isWinner ? 'bg-amber-950/40 border-amber-500 animate-pulse' : 'bg-slate-900 border-slate-800'}`}>
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-3">
                            <div className="w-9 h-9 rounded-xl flex items-center justify-center text-base shadow border border-white/10" style={{ backgroundColor: faction?.color }}>
                              <i className={`fa-solid ${faction?.icon} text-slate-950`}></i>
                            </div>
                            <div>
                              <input 
                                type="text" 
                                value={p.name} 
                                onChange={(e) => setPlayers(players.map(x => x.id === p.id ? {...x, name: e.target.value} : x))}
                                className="bg-transparent font-bold text-base text-white focus:outline-none focus:border-b border-cyan-400 w-28"
                              />
                              {isWinner && <i className="fa-solid fa-trophy text-amber-400 text-xs ml-1"></i>}
                            </div>
                          </div>

                          <div className={`font-orbitron font-black text-2xl px-3 py-1 rounded-xl ${isWinner ? 'bg-amber-500 text-black' : 'bg-slate-950 text-cyan-400 border border-slate-800'}`}>
                            {score}
                          </div>
                        </div>

                        {/* Выбор Фракции */}
                        <div className="bg-slate-950 p-2 rounded-xl border border-slate-800 flex items-center justify-between">
                          <span className="text-[10px] uppercase font-bold text-slate-500">Фракция:</span>
                          <select 
                            value={p.factionId} 
                            onChange={(e) => setPlayers(players.map(x => x.id === p.id ? {...x, factionId: e.target.value} : x))}
                            className="bg-transparent text-xs font-bold text-slate-200 focus:outline-none text-right">
                            {availableFactions.map(f => (
                              <option key={f.id} value={f.id} className="bg-slate-900 text-white">{f.name}</option>
                            ))}
                          </select>
                        </div>

                        {/* Секретки и Мекатол */}
                        <div className="flex items-center justify-between text-xs text-slate-400 border-t border-slate-800/80 pt-2">
                          <div>Секретки: <span className="text-amber-400 font-bold">{p.secrets}</span> 
                            <button onClick={() => setPlayers(players.map(x => x.id === p.id ? {...x, secrets: x.secrets + 1} : x))} className="ml-1 px-1.5 py-0.5 bg-slate-800 rounded text-cyan-400 font-bold">+</button>
                          </div>
                          <div>Мекатол/Реликвии: <span className="text-purple-400 font-bold">{p.extra}</span>
                            <button onClick={() => setPlayers(players.map(x => x.id === p.id ? {...x, extra: x.extra + 1} : x))} className="ml-1 px-1.5 py-0.5 bg-slate-800 rounded text-cyan-400 font-bold">+</button>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

          </main>

          <nav className="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 p-2 flex justify-around z-40">
            <button 
              onClick={() => setActiveTab('turns')} 
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-[11px] font-bold transition ${activeTab === 'turns' ? 'text-cyan-400' : 'text-slate-400'}`}>
              <i className="fa-solid fa-stopwatch text-base"></i>
              <span>Ходы</span>
            </button>
            <button 
              onClick={() => setActiveTab('objectives')} 
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-[11px] font-bold transition ${activeTab === 'objectives' ? 'text-cyan-400' : 'text-slate-400'}`}>
              <i className="fa-solid fa-list-check text-base"></i>
              <span>Задания</span>
            </button>
            <button 
              onClick={() => setActiveTab('scoreboard')} 
              className={`flex flex-col items-center gap-1 py-1 px-3 rounded-xl text-[11px] font-bold transition ${activeTab === 'scoreboard' ? 'text-cyan-400' : 'text-slate-400'}`}>
              <i className="fa-solid fa-trophy text-base"></i>
              <span>Счет</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
