<body class="min-h-screen pb-10">

    <div id="root"></div>

    <script type="text/babel">
        // ⬇️ ВСТАВЛЯЕМ СУДА НАШИ КЛЮЧИ ⬇️
        const JSONBIN_BIN_ID = "6a68bf9bda38895dfe9bd0fa";
        const JSONBIN_MASTER_KEY = "$2a$10$gw0QLrm7P8ZXGGiJyYA9nedbj3pYzL55eJOEBPvS6t3EuOkqnC13W";
        const ADMIN_PIN = "7777";

        const { useState, useEffect } = React;
        const { motion, AnimatePresence } = window.Motion;

        const ALL_FACTIONS = [
            // Базовая игра
            { id: 'sol', name: 'Федерация Сол', color: '#3b82f6', exp: 'base', iconUrl: './factions/federation-of-sol.webp' },
            { id: 'jolnar', name: 'Университеты Джол-Нара', color: '#06b6d4', exp: 'base', iconUrl: './factions/universities-of-jol-nar.webp' },
            { id: 'hacan', name: 'Хаканские эмираты', color: '#eab308', exp: 'base', iconUrl: './factions/emirates-of-hacan.webp' },
            { id: 'xxcha', name: 'Королевство Ззча', color: '#22c55e', exp: 'base', iconUrl: './factions/xxcha-kingdom.webp' },
            { id: 'nekro', name: 'Некровирус', color: '#ef4444', exp: 'base', iconUrl: './factions/nekro-virus.webp' },
            { id: 'saar', name: 'Кланы Сааров', color: '#a855f7', exp: 'base', iconUrl: './factions/clan-of-saar.webp' },
            { id: 'l1z1x', name: 'ПсихосетьL1Z1X', color: '#64748b', exp: 'base', iconUrl: './factions/l1z1x-mindnet.webp' },
            { id: 'letnev', name: 'Баронат Летнев', color: '#475569', exp: 'base', iconUrl: './factions/barony-of-letnev.webp' },
            { id: 'arborec', name: 'Арбореки', color: '#15803d', exp: 'base', iconUrl: './factions/arborec.webp' },
            { id: 'creuss', name: 'Призраки Креуса', color: '#38bdf8', exp: 'base', iconUrl: './factions/ghosts-of-creuss.webp' },
            { id: 'mentak', name: 'Коалиция Ментака', color: '#f97316', exp: 'base', iconUrl: './factions/mentak-coalition.webp' },
            { id: 'muaat', name: 'Тлеющие с Муаата', color: '#dc2626', exp: 'base', iconUrl: './factions/embers-of-muaat.webp' },
            { id: 'naalu', name: 'Клубок Наалу', color: '#84cc16', exp: 'base', iconUrl: './factions/naalu-collective.webp' },
            { id: 'saardakk', name: 'Сардакк Нор', color: '#991b1b', exp: 'base', iconUrl: './factions/sardakk-norr.webp' },
            { id: 'yin', name: 'Братство Инь', color: '#e2e8f0', exp: 'base', iconUrl: './factions/yin-brotherhood.webp' },
            { id: 'yssaril', name: 'Племена Иссарилов', color: '#166534', exp: 'base', iconUrl: './factions/yssaril-tribes.webp' },
            { id: 'winnu', name: 'Винну', color: '#a855f7', exp: 'base', iconUrl: './factions/winnu.webp' },

            // Prophecy of Kings (PoK)
            { id: 'argent', name: 'Серебряная Стая', color: '#facc15', exp: 'pok', iconUrl: './factions/argent-flight.webp' },
            { id: 'empyrean', name: 'Возвышеные', color: '#818cf8', exp: 'pok', iconUrl: './factions/empyrean.webp' },
            { id: 'mahact', name: 'Генные чародеи Махакт', color: '#fbbf24', exp: 'pok', iconUrl: './factions/mahact-gene-sorcerers.webp' },
            { id: 'naazrokha', name: 'Альянс Нааз-Роха', color: '#10b981', exp: 'pok', iconUrl: './factions/naaz-rokha-alliance.webp' },
            { id: 'nomad', name: 'Кочевник (Nomad)', color: '#f43f5e', exp: 'pok', iconUrl: './factions/nomad.webp' },
            { id: 'titans', name: 'Титаны Ула', color: '#a1a1aa', exp: 'pok', iconUrl: './factions/titans-of-ul.webp' },
            { id: 'vuilraith', name: 'Кабала Вуил’Райт', color: '#b91c1c', exp: 'pok', iconUrl: './factions/vuil-raith-cabal.webp' },

            // Thunder's Edge (TE) и модули
            { id: 'keleres_argent', name: 'Совет Келерес (Аргенты)', color: '#38bdf8', exp: 'te', iconUrl: './factions/council-keleres-argent.webp' },
            { id: 'keleres_mentak', name: 'Совет Келерес (Ментак)', color: '#38bdf8', exp: 'te', iconUrl: './factions/council-keleres-mentak.webp' },
            { id: 'keleres_xxcha', name: 'Совет Келерес (Ззча)', color: '#38bdf8', exp: 'te', iconUrl: './factions/council-keleres-xxcha.webp' },
            { id: 'crimson', name: 'Багряное Восстание', color: '#dc2626', exp: 'te', iconUrl: './factions/crimson-rebellion.webp' },
            { id: 'deepwrought', name: 'Школа Глубин', color: '#0284c7', exp: 'te', iconUrl: './factions/deepwrought-scholarate.webp' },
            { id: 'firmament', name: 'Твердь Небесная', color: '#475569', exp: 'te', iconUrl: './factions/firmament-obsidian.webp' },
            { id: 'bastion', name: 'Последний Оплот', color: '#ca8a04', exp: 'te', iconUrl: './factions/last-bastion.webp' },
            { id: 'ralnel', name: 'Консорциум Рал-Нель', color: '#2563eb', exp: 'te', iconUrl: './factions/ral-nel-consortium.webp' }
        ];

        const STRATEGY_CARDS = [
            { id: 1, name: '1. Лидерство', initiative: 1, color: 'border-red-500 bg-red-950/50 text-red-300' },
            { id: 2, name: '2. Дипломатия', initiative: 2, color: 'border-amber-500 bg-amber-950/50 text-amber-300' },
            { id: 3, name: '3. Политика', initiative: 3, color: 'border-yellow-500 bg-yellow-950/50 text-yellow-300' },
            { id: 4, name: '4. Строительство', initiative: 4, color: 'border-emerald-500 bg-emerald-950/50 text-emerald-300' },
            { id: 5, name: '5. Торговля', initiative: 5, color: 'border-teal-500 bg-teal-950/50 text-teal-300' },
            { id: 6, name: '6. Война', initiative: 6, color: 'border-cyan-500 bg-cyan-950/50 text-cyan-300' },
            { id: 7, name: '7. Технологии', initiative: 7, color: 'border-blue-500 bg-blue-950/50 text-blue-300' },
            { id: 8, name: '8. Экспансия', initiative: 8, color: 'border-purple-500 bg-purple-950/50 text-purple-300' }
        ];

        const DEFAULT_OBJECTIVES = [
            { id: 'obj_1', title: 'Укрепить границы', stage: 1, points: 1, desc: 'Иметь сооружения на 2 планетах вне родной системы' },
            { id: 'obj_2', title: 'Расширить владения', stage: 1, points: 1, desc: 'Контролировать 6 планет вне родной системы' }
        ];

        const formatTime = (totalSeconds) => {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        };

        function App() {
            const [isGameActive, setIsGameActive] = useState(() => JSON.parse(localStorage.getItem('ti4_active')) || false);
            const [targetScore, setTargetScore] = useState(() => JSON.parse(localStorage.getItem('ti4_targetScore')) || 10);
            const [roundNumber, setRoundNumber] = useState(() => JSON.parse(localStorage.getItem('ti4_round')) || 1);

            const [usePok, setUsePok] = useState(true);
            const [useTe, setUseTe] = useState(true);

            const [players, setPlayers] = useState(() => {
                return JSON.parse(localStorage.getItem('ti4_players')) || [
                    { id: 1, name: 'Игрок 1', factionId: 'sol', color: '#3b82f6', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
                    { id: 2, name: 'Игрок 2', factionId: 'jolnar', color: '#06b6d4', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
                    { id: 3, name: 'Игрок 3', factionId: 'hacan', color: '#eab308', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
                    { id: 4, name: 'Игрок 4', factionId: 'xxcha', color: '#22c55e', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
                    { id: 5, name: 'Игрок 5', factionId: 'nekro', color: '#ef4444', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
                    { id: 6, name: 'Игрок 6', factionId: 'saar', color: '#a855f7', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
                ];
            });

            const [objectives, setObjectives] = useState(() => JSON.parse(localStorage.getItem('ti4_objectives')) || DEFAULT_OBJECTIVES);
            const [completions, setCompletions] = useState(() => JSON.parse(localStorage.getItem('ti4_completions')) || {});

            const [strategyPicks, setStrategyPicks] = useState({});
            const [usedStrategies, setUsedStrategies] = useState({});
            const [turnOrder, setTurnOrder] = useState([]);
            const [activeTurnIdx, setActiveTurnIdx] = useState(0);
            const [passed, setPassed] = useState({});

            // Модальные окна
            const [showStrategyModal, setShowStrategyModal] = useState(false);
            const [showRoundModal, setShowRoundModal] = useState(false);
            const [showStatsModal, setShowStatsModal] = useState(false);

            // История и загрузка статистики
            const [globalHistory, setGlobalHistory] = useState([]);
            const [isStatsLoading, setIsStatsLoading] = useState(false);

            // Таймер
            const [turnTime, setTurnTime] = useState(0);

            useEffect(() => {
                localStorage.setItem('ti4_active', JSON.stringify(isGameActive));
                localStorage.setItem('ti4_targetScore', JSON.stringify(targetScore));
                localStorage.setItem('ti4_round', JSON.stringify(roundNumber));
                localStorage.setItem('ti4_players', JSON.stringify(players));
                localStorage.setItem('ti4_objectives', JSON.stringify(objectives));
                localStorage.setItem('ti4_completions', JSON.stringify(completions));
            }, [isGameActive, targetScore, roundNumber, players, objectives, completions]);

            // Загрузить историю из облака
            const fetchGlobalStats = async () => {
                try {
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                        method: 'GET',
                        headers: { 'X-Master-Key': JSONBIN_MASTER_KEY, 'X-Bin-Meta': 'false' }
                    });
                    const history = await response.json();
                    return Array.isArray(history) ? history : [];
                } catch (e) { return []; }
            };

            const openStatsModal = async () => {
                setShowStatsModal(true);
                setIsStatsLoading(true);
                const stats = await fetchGlobalStats();
                setGlobalHistory(stats);
                setIsStatsLoading(false);
            };

            const deleteSingleGame = async (gameId) => {
                const pin = prompt("Введите ADMIN PIN для удаления:");
                if (pin !== ADMIN_PIN) {
                    alert("Неверный PIN!");
                    return;
                }
                const updated = globalHistory.filter(g => g.id !== gameId);
                try {
                    await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_MASTER_KEY },
                        body: JSON.stringify(updated)
                    });
                    setGlobalHistory(updated);
                    alert("Партия удалена.");
                } catch (e) {
                    alert("Ошибка при удалении.");
                }
            };

            const clearAllStats = async () => {
                const pin = prompt("Введите ADMIN PIN для сброса всей статистики:");
                if (pin !== ADMIN_PIN) {
                    alert("Неверный PIN!");
                    return;
                }
                if (!confirm("Вы уверены? Вся история будет удалена безвозвратно!")) return;
                try {
                    await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_MASTER_KEY },
                        body: JSON.stringify([])
                    });
                    setGlobalHistory([]);
                    alert("Вся статистика очищена.");
                } catch (e) {
                    alert("Ошибка при очистке.");
                }
            };

            // Сохранить завершенную игру в облако
            const saveGameToCloud = async (winnerPlayer) => {
                const gameRecord = {
                    id: Date.now(),
                    date: new Date().toLocaleDateString('ru-RU'),
                    targetScore,
                    roundsCount: roundNumber,
                    winner: winnerPlayer ? winnerPlayer.name : "Ничья",
                    winningFaction: winnerPlayer ? (ALL_FACTIONS.find(f => f.id === winnerPlayer.factionId)?.name || "") : "",
                    players: players.map(p => ({
                        name: p.name,
                        faction: ALL_FACTIONS.find(f => f.id === p.factionId)?.name || p.factionId,
                        score: getPlayerScore(p.id),
                        totalTime: p.totalTime || 0,
                        avgTurnTime: roundNumber > 0 ? Math.round((p.totalTime || 0) / roundNumber) : 0,
                        isWinner: winnerPlayer ? p.id === winnerPlayer.id : false
                    }))
                };

                try {
                    const currentHistory = await fetchGlobalStats();
                    currentHistory.unshift(gameRecord);
                    await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'X-Master-Key': JSONBIN_MASTER_KEY },
                        body: JSON.stringify(currentHistory)
                    });
                    alert("Партия успешно сохранена в общую статистику! 🏆");
                } catch (e) {
                    alert("Ошибка при сохранении в облако.");
                }
            };

            const activePlayer = turnOrder[activeTurnIdx];
            const activeStrategyCard = activePlayer ? STRATEGY_CARDS.find(c => c.id === strategyPicks[activePlayer.id]) : null;
            const isCurrentStrategyPlayed = activeStrategyCard ? !!usedStrategies[activeStrategyCard.id] : false;

            // Таймер хода
            useEffect(() => {
                let interval = null;
                if (isGameActive && turnOrder.length > 0 && activePlayer && !passed[activePlayer.id]) {
                    interval = setInterval(() => {
                        setTurnTime(prev => prev + 1);
                        setPlayers(prevPlayers =>
                            prevPlayers.map(p => p.id === activePlayer.id ? { ...p, totalTime: (p.totalTime || 0) + 1 } : p)
                        );
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [isGameActive, turnOrder, activeTurnIdx, activePlayer, passed]);

            const availableFactions = ALL_FACTIONS.filter(f => {
                if (f.exp === 'base') return true;
                if (f.exp === 'pok' && usePok) return true;
                if (f.exp === 'te' && useTe) return true;
                return false;
            });

            const addPlayer = () => {
                if (players.length >= 8) return;
                const newId = Date.now();
                const unassignedFaction = availableFactions.find(f => !players.some(p => p.factionId === f.id)) || availableFactions[0];
                setPlayers([...players, { id: newId, name: `Игрок ${players.length + 1}`, factionId: unassignedFaction.id, secrets: 0, extra: 0, breakthrough: false, totalTime: 0 }]);
            };

            const removePlayer = (id) => {
                if (players.length <= 2) return;
                setPlayers(players.filter(p => p.id !== id));
            };

            const getPlayerScore = (playerId) => {
                const p = players.find(x => x.id === playerId);
                if (!p) return 0;
                let score = p.secrets + p.extra;
                objectives.forEach(obj => {
                    if (completions[`${playerId}_${obj.id}`]) score += obj.points;
                });
                return score;
            };

            const toggleCompletion = (pId, oId) => {
                const key = `${pId}_${oId}`;
                setCompletions(prev => ({ ...prev, [key]: !prev[key] }));
            };
            const handleAddSecret = (playerId) => {
                setPlayers(prev => prev.map(p => {
                    if (p.id !== playerId) return p;

                    if (p.secrets === 3) {
                        const confirmFourth = window.confirm(
                            `У ${p.name} уже 3 секретные цели (стандартный лимит). Добавить 4-ю целевую секретку?`
                        );
                        if (!confirmFourth) return p;
                    }

                    return { ...p, secrets: Math.min(4, p.secrets + 1) };
                }));
            };
            const addCustomObj = () => {
                const title = prompt('Введите название цели:');
                if (!title) return;
                const stage = prompt('Этап цели (1 или 2):', '1');
                const points = Number(stage) === 2 ? 2 : 1;
                setObjectives(prev => [...prev, { id: 'custom_' + Date.now(), title, stage: Number(stage), points, desc: 'Пользовательская цель' }]);
            };
            const exportGameToken = () => {
                const gameState = {
                    targetScore,
                    roundNumber,
                    players,
                    objectives,
                    completions,
                    strategyPicks,
                    usedStrategies,
                    turnOrder,
                    activeTurnIdx,
                    passed,
                    timestamp: Date.now()
                };
                try {
                    const jsonString = JSON.stringify(gameState);
                    const token = btoa(encodeURIComponent(jsonString));
                    navigator.clipboard.writeText(token);
                    alert('Код партии скопирован в буфер обмена!');
                } catch (e) {
                    alert('Ошибка при создании кода партии.');
                }
            };

            const importGameToken = (tokenString) => {
                if (!tokenString || !tokenString.trim()) {
                    alert('Введите код партии!');
                    return;
                }
                try {
                    const jsonString = decodeURIComponent(atob(tokenString.trim()));
                    const data = JSON.parse(jsonString);

                    if (!data.players || !Array.isArray(data.players) || !data.targetScore) {
                        throw new Error('Некорректная структура данных');
                    }

                    setTargetScore(data.targetScore);
                    setRoundNumber(data.roundNumber || 1);
                    setPlayers(data.players);
                    setObjectives(data.objectives || DEFAULT_OBJECTIVES);
                    setCompletions(data.completions || {});
                    setStrategyPicks(data.strategyPicks || {});
                    setUsedStrategies(data.usedStrategies || {});
                    setTurnOrder(data.turnOrder || []);
                    setActiveTurnIdx(data.activeTurnIdx || 0);
                    setPassed(data.passed || {});
                    setIsGameActive(true);

                    alert('Партия успешно загружена!');
                } catch (e) {
                    alert('Неверный код партии или данные повреждены!');
                }
            };
            // Сохранение снимка состояния в журнал
            const saveSnapshot = () => {
                const currentSnap = {
                    targetScore,
                    roundNumber,
                    players,
                    objectives,
                    completions,
                    strategyPicks,
                    usedStrategies,
                    turnOrder,
                    activeTurnIdx,
                    passed,
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                };

                const existing = JSON.parse(localStorage.getItem('ti4_snapshots')) || [];
                // Храним только 5 последних снимков
                const updated = [currentSnap, ...existing].slice(0, 5);
                localStorage.setItem('ti4_snapshots', JSON.stringify(updated));
            };

            // Восстановление снимка по объекту
            const restoreSnapshot = (snap) => {
                if (!confirm(`Восстановить сохранение от ${snap.timestamp}? Текущий прогресс изменится.`)) return;

                setTargetScore(snap.targetScore);
                setRoundNumber(snap.roundNumber || 1);
                setPlayers(snap.players);
                setObjectives(snap.objectives || DEFAULT_OBJECTIVES);
                setCompletions(snap.completions || {});
                setStrategyPicks(snap.strategyPicks || {});
                setUsedStrategies(snap.usedStrategies || {});
                setTurnOrder(snap.turnOrder || []);
                setActiveTurnIdx(snap.activeTurnIdx || 0);
                setPassed(snap.passed || {});
                setIsGameActive(true);
            };

            const confirmStrategyPicksAndStart = () => {
                const unpickedCount = players.filter(p => !strategyPicks[p.id]).length;
                if (unpickedCount > 0) {
                    alert('Все игроки должны выбрать карту стратегии!');
                    return;
                }

                const ordered = [...players]
                    .sort((a, b) => {
                        const cardA = STRATEGY_CARDS.find(c => c.id === strategyPicks[a.id]);
                        const cardB = STRATEGY_CARDS.find(c => c.id === strategyPicks[b.id]);
                        return (cardA?.initiative || 99) - (cardB?.initiative || 99);
                    });

                setTurnOrder(ordered);
                setActiveTurnIdx(0);
                setTurnTime(0);
                setPassed({});
                setShowStrategyModal(false);
            };

            const nextTurn = () => {
                if (turnOrder.length === 0) return;

                let nextIdx = (activeTurnIdx + 1) % turnOrder.length;
                let checkedCount = 0;

                while (passed[turnOrder[nextIdx].id] && checkedCount < turnOrder.length) {
                    nextIdx = (nextIdx + 1) % turnOrder.length;
                    checkedCount++;
                }

                const activeCount = turnOrder.filter(p => !passed[p.id]).length;
                if (activeCount === 0) {
                    setShowRoundModal(true);
                    return;
                }

                setActiveTurnIdx(nextIdx);
                setTurnTime(0);
            };

            const passTurn = (pId) => {
                if (!isCurrentStrategyPlayed) {

                                                                        <i className="fa-solid fa-trash-can"></i>
                                                                    </button>
                                                                </div>
                                                            </div>
                                                            <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 text-[11px]">
                                                                {(g.players || []).map((p, i) => (
                                                                    <div key={i} className="bg-slate-950 p-1.5 rounded-lg border border-slate-800/50 flex items-center justify-between">
                                                                        <span className="text-slate-300 truncate">{p.name}</span>
                                                                        <span className="font-mono text-slate-400">{p.score} ПО / ⏱{formatTime(p.totalTime || 0)}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            {/* 4. Очистка всей базы */}
                                            <div className="pt-4 border-t border-slate-800 flex justify-end">
                                                <button
                                                    onClick={clearAllStats}
                                                    className="bg-red-950/40 hover:bg-red-900/60 text-red-400 border border-red-800/60 text-xs px-4 py-2 rounded-xl transition flex items-center gap-2"
                                                >
                                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                                    <span>Сбросить всю статистику (PIN)</span>
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
