<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TI4 Companion - Turn Order & Timers</title>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Rajdhani', sans-serif;
      background-color: #030712;
      color: #f3f4f6;
      -webkit-tap-highlight-color: transparent;
    }

    .font-orbitron {
      font-family: 'Orbitron', sans-serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: #0b0f19;
    }

    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 3px;
    }
  </style>
</head>

<body class="min-h-screen pb-10">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ALL_FACTIONS = [
      // Базовая игра
      { id: 'sol', name: 'Федерация Сол', color: '#3b82f6', exp: 'base', iconUrl: './factions/federation-of-sol.webp' },
      { id: 'jolnar', name: 'Университеты Джол-Нара', color: '#06b6d4', exp: 'base', iconUrl: './factions/universities-of-jol-nar.webp' },
      { id: 'hacan', name: 'Эмират Хакан', color: '#eab308', exp: 'base', iconUrl: './factions/emirates-of-hacan.webp' },
      { id: 'xxcha', name: 'Королевство Ззча', color: '#22c55e', exp: 'base', iconUrl: './factions/xxcha-kingdom.webp' },
      { id: 'nekro', name: 'Вирус Некро', color: '#ef4444', exp: 'base', iconUrl: './factions/nekro-virus.webp' },
      { id: 'saar', name: 'Кланы Сааров', color: '#a855f7', exp: 'base', iconUrl: './factions/clan-of-saar.webp' },
      { id: 'l1z1x', name: 'Иерархия L1Z1X', color: '#64748b', exp: 'base', iconUrl: './factions/l1z1x-mindnet.webp' },
      { id: 'letnev', name: 'Баронат Летнев', color: '#475569', exp: 'base', iconUrl: './factions/barony-of-letnev.webp' },
      { id: 'arborec', name: 'Древостой Арбореков', color: '#15803d', exp: 'base', iconUrl: './factions/arborec.webp' },
      { id: 'creuss', name: 'Призраки Крёсса', color: '#38bdf8', exp: 'base', iconUrl: './factions/ghosts-of-creuss.webp' },
      { id: 'mentak', name: 'Коалиция Ментака', color: '#f97316', exp: 'base', iconUrl: './factions/mentak-coalition.webp' },
      { id: 'muaat', name: 'Уполномоченные Муаата', color: '#dc2626', exp: 'base', iconUrl: './factions/embers-of-muaat.webp' },
      { id: 'naalu', name: 'Валлиада Наалу', color: '#84cc16', exp: 'base', iconUrl: './factions/naalu-collective.webp' },
      { id: 'saardakk', name: 'Сардакк Ноур', color: '#991b1b', exp: 'base', iconUrl: './factions/sardakk-norr.webp' },
      { id: 'yin', name: 'Братство Инь', color: '#e2e8f0', exp: 'base', iconUrl: './factions/yin-brotherhood.webp' },
      { id: 'yssaril', name: 'Племена Иссарилов', color: '#166534', exp: 'base', iconUrl: './factions/yssaril-tribes.webp' },
      { id: 'winnu', name: 'Винну', color: '#a855f7', exp: 'base', iconUrl: './factions/winnu.webp' },

      // Prophecy of Kings (PoK)
      { id: 'argent', name: 'Летный Альянс Аргентов', color: '#facc15', exp: 'pok', iconUrl: './factions/argent-flight.webp' },
      { id: 'empyrean', name: 'Эмпиреи', color: '#818cf8', exp: 'pok', iconUrl: './factions/empyrean.webp' },
      { id: 'mahact', name: 'Генетическая Империя Махакт', color: '#fbbf24', exp: 'pok', iconUrl: './factions/mahact-gene-sorcerers.webp' },
      { id: 'naazrokha', name: 'Альянс Нааз-Роха', color: '#10b981', exp: 'pok', iconUrl: './factions/naaz-rokha-alliance.webp' },
      { id: 'nomad', name: 'Кочевник (Nomad)', color: '#f43f5e', exp: 'pok', iconUrl: './factions/nomad.webp' },
      { id: 'titans', name: 'Титаны Ула', color: '#a1a1aa', exp: 'pok', iconUrl: './factions/titans-of-ul.webp' },
      { id: 'vuilraith', name: 'Кабала Вуил’Райт', color: '#b91c1c', exp: 'pok', iconUrl: './factions/vuil-raith-cabal.webp' },

      // Thunder's Edge (TE) и модули
      { id: 'keleres_argent', name: 'Совет Келерес (Аргенты)', color: '#38bdf8', exp: 'te', iconUrl: './factions/council-keleres-argent.webp' },
      { id: 'keleres_mentak', name: 'Совет Келерес (Ментак)', color: '#38bdf8', exp: 'te', iconUrl: './factions/council-keleres-mentak.webp' },
      { id: 'keleres_xxcha', name: 'Совет Келерес (Ззча)', color: '#38bdf8', exp: 'te', iconUrl: './factions/council-keleres-xxcha.webp' },
      { id: 'crimson', name: 'Багряное Восстание', color: '#dc2626', exp: 'te', iconUrl: './factions/crimson-rebellion.webp' },
      { id: 'deepwrought', name: 'Школа Глубин', color: '#0284c7', exp: 'te', iconUrl: './factions/deepwrought-scholarate.webp' },
      { id: 'firmament', name: 'Твердь Небесная', color: '#475569', exp: 'te', iconUrl: './factions/firmament-obsidian.webp' },
      { id: 'bastion', name: 'Последний Оплот', color: '#ca8a04', exp: 'te', iconUrl: './factions/last-bastion.webp' },
      { id: 'ralnel', name: 'Консорциум Рал-Нель', color: '#2563eb', exp: 'te', iconUrl: './factions/ral-nel-consortium.webp' }
    ];

    const STRATEGY_CARDS = [
      { id: 1, name: '1. Величие', initiative: 1, color: 'border-red-500 bg-red-950/40 text-red-300' },
      { id: 2, name: '2. Дипломатия', initiative: 2, color: 'border-amber-500 bg-amber-950/40 text-amber-300' },
      { id: 3, name: '3. Политика', initiative: 3, color: 'border-yellow-500 bg-yellow-950/40 text-yellow-300' },
      { id: 4, name: '4. Строительство', initiative: 4, color: 'border-emerald-500 bg-emerald-950/40 text-emerald-300' },
      { id: 5, name: '5. Торговля', initiative: 5, color: 'border-teal-500 bg-teal-950/40 text-teal-300' },
      { id: 6, name: '6. Война', initiative: 6, color: 'border-cyan-500 bg-cyan-950/40 text-cyan-300' },
      { id: 7, name: '7. Технологии', initiative: 7, color: 'border-blue-500 bg-blue-950/40 text-blue-300' },
      { id: 8, name: '8. Экспансия', initiative: 8, color: 'border-purple-500 bg-purple-950/40 text-purple-300' }
    ];

    const DEFAULT_OBJECTIVES = [
      { id: 'obj_1', title: 'Укрепить границы', stage: 1, points: 1, desc: 'Иметь сооружения на 2 планетах вне родной системы' },
      { id: 'obj_2', title: 'Расширить владения', stage: 1, points: 1, desc: 'Контролировать 6 планет вне родной системы' }
    ];

    // Форматирование секунд в ММ:СС
    const formatTime = (totalSeconds) => {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    };

    function App() {
      const [isGameActive, setIsGameActive] = useState(() => JSON.parse(localStorage.getItem('ti4_active')) || false);
      const [targetScore, setTargetScore] = useState(() => JSON.parse(localStorage.getItem('ti4_targetScore')) || 10);
      const [roundNumber, setRoundNumber] = useState(() => JSON.parse(localStorage.getItem('ti4_round')) || 1);

      const [usePok, setUsePok] = useState(true);
      const [useTe, setUseTe] = useState(true);

      const [players, setPlayers] = useState(() => {
        return JSON.parse(localStorage.getItem('ti4_players')) || [
          { id: 1, name: 'Игрок 1', factionId: 'sol', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
          { id: 2, name: 'Игрок 2', factionId: 'jolnar', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
          { id: 3, name: 'Игрок 3', factionId: 'hacan', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
          { id: 4, name: 'Игрок 4', factionId: 'xxcha', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
          { id: 5, name: 'Игрок 5', factionId: 'nekro', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
          { id: 6, name: 'Игрок 6', factionId: 'saar', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
        ];
      });

      const [objectives, setObjectives] = useState(() => JSON.parse(localStorage.getItem('ti4_objectives')) || DEFAULT_OBJECTIVES);
      const [completions, setCompletions] = useState(() => JSON.parse(localStorage.getItem('ti4_completions')) || {});

      const [strategyPicks, setStrategyPicks] = useState({});
      const [usedStrategies, setUsedStrategies] = useState({});
      const [turnOrder, setTurnOrder] = useState([]);
      const [activeTurnIdx, setActiveTurnIdx] = useState(0);
      const [passed, setPassed] = useState({});

      // Таймеры
      const [turnTime, setTurnTime] = useState(0);
      const [showRoundModal, setShowRoundModal] = useState(false);

      // Синхронизация с LocalStorage
      useEffect(() => {
        localStorage.setItem('ti4_active', JSON.stringify(isGameActive));
        localStorage.setItem('ti4_targetScore', JSON.stringify(targetScore));
        localStorage.setItem('ti4_round', JSON.stringify(roundNumber));
        localStorage.setItem('ti4_players', JSON.stringify(players));
        localStorage.setItem('ti4_objectives', JSON.stringify(objectives));
        localStorage.setItem('ti4_completions', JSON.stringify(completions));
      }, [isGameActive, targetScore, roundNumber, players, objectives, completions]);

      const activePlayer = turnOrder[activeTurnIdx];

      // Таймер хода
      useEffect(() => {
        let interval = null;
        if (isGameActive && turnOrder.length > 0 && activePlayer && !passed[activePlayer.id]) {
          interval = setInterval(() => {
            setTurnTime(prev => prev + 1);
            setPlayers(prevPlayers =>
              prevPlayers.map(p => p.id === activePlayer.id ? { ...p, totalTime: (p.totalTime || 0) + 1 } : p)
            );
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [isGameActive, turnOrder, activeTurnIdx, activePlayer, passed]);

      const availableFactions = ALL_FACTIONS.filter(f => {
        if (f.exp === 'base') return true;
        if (f.exp === 'pok' && usePok) return true;
        if (f.exp === 'te' && useTe) return true;
        return false;
      });

      const addPlayer = () => {
        if (players.length >= 8) return;
        const newId = Date.now();
        const unassignedFaction = availableFactions.find(f => !players.some(p => p.factionId === f.id)) || availableFactions[0];
        setPlayers([...players, { id: newId, name: `Игрок ${players.length + 1}`, factionId: unassignedFaction.id, secrets: 0, extra: 0, breakthrough: false, totalTime: 0 }]);
      };

      const removePlayer = (id) => {
        if (players.length <= 2) return;
        setPlayers(players.filter(p => p.id !== id));
      };

      const getPlayerScore = (playerId) => {
        const p = players.find(x => x.id === playerId);
        if (!p) return 0;
        let score = p.secrets + p.extra;
        objectives.forEach(obj => {
          if (completions[`${playerId}_${obj.id}`]) score += obj.points;
        });
        return score;
      };

      const toggleCompletion = (pId, oId) => {
        const key = `${pId}_${oId}`;
        setCompletions(prev => ({ ...prev, [key]: !prev[key] }));
      };

      const addCustomObj = () => {
        const title = prompt('Введите название цели:');
        if (!title) return;
        const stage = prompt('Этап цели (1 или 2):', '1');
        const points = Number(stage) === 2 ? 2 : 1;
        setObjectives(prev => [...prev, { id: 'custom_' + Date.now(), title, stage: Number(stage), points, desc: 'Пользовательская цель' }]);
      };

      const startActionPhase = () => {
        const ordered = [...players]
          .filter(p => strategyPicks[p.id])
          .sort((a, b) => (strategyPicks[a.id] || 99) - (strategyPicks[b.id] || 99));

        if (ordered.length === 0) {
          alert('Выберите карты стратегий для игроков!');
          return;
        }
        setTurnOrder(ordered);
        setActiveTurnIdx(0);
        setTurnTime(0);
        setPassed({});
      };

      const nextTurn = () => {
        if (turnOrder.length === 0) return;

        // Поиск следующего НЕ пасовавшего игрока
        let nextIdx = (activeTurnIdx + 1) % turnOrder.length;
        let checkedCount = 0;

        while (passed[turnOrder[nextIdx].id] && checkedCount < turnOrder.length) {
          nextIdx = (nextIdx + 1) % turnOrder.length;
          checkedCount++;
        }

        // Если все спасовали — раунд окончен
        const activeCount = turnOrder.filter(p => !passed[p.id]).length;
        if (activeCount === 0) {
          setShowRoundModal(true);
          return;
        }

        setActiveTurnIdx(nextIdx);
        setTurnTime(0);
      };

      const passTurn = (pId) => {
        const updatedPassed = { ...passed, [pId]: true };
        setPassed(updatedPassed);

        // Проверяем, сколько активных игроков осталось
        const remainingActive = turnOrder.filter(p => !updatedPassed[p.id]);

        if (remainingActive.length === 0) {
          setShowRoundModal(true);
        } else {
          nextTurn();
        }
      };

      const confirmNextRound = () => {
        setShowRoundModal(false);
        setRoundNumber(prev => prev + 1);
        setStrategyPicks({});
        setUsedStrategies({});
        setTurnOrder([]);
        setActiveTurnIdx(0);
        setPassed({});
        setTurnTime(0);
      };

      const isFactionTaken = (factionId, currentPlayerId) => {
        return players.some(p => p.id !== currentPlayerId && p.factionId === factionId);
      };

      return (
        <div className="max-w-7xl mx-auto min-h-screen flex flex-col bg-slate-950 text-slate-100">

          {/* ХЕДЕР */}
          <header className="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30 shadow-xl">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-3">
                <i className="fa-solid fa-khanda text-cyan-400 text-xl"></i>
                <span className="font-orbitron font-extrabold text-lg md:text-xl text-white tracking-wider">TI4 TRACKER</span>
              </div>

              <div className="flex items-center gap-3">
                {isGameActive ? (
                  <>
                    <div className="text-xs font-bold text-amber-400 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl font-orbitron">
                      РАУНД {roundNumber}
                    </div>

                    <div className="text-xs font-bold text-cyan-400 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl">
                      Цель: {targetScore} ПО
                    </div>

                    <button
                      onClick={() => {
                        if (confirm('Завершить игру и вернуться в настройки?')) setIsGameActive(false);
                      }}
                      className="bg-red-900/80 hover:bg-red-800 text-red-200 font-extrabold px-3 py-1.5 rounded-xl text-xs border border-red-700 transition flex items-center gap-1 shadow">
                      <i className="fa-solid fa-square-xmark"></i>
                      <span className="hidden sm:inline">Завершить</span>
                    </button>
                  </>
                ) : (
                  <div className="bg-cyan-950/80 text-cyan-400 border border-cyan-800 px-3 py-1 rounded-xl font-bold text-xs uppercase tracking-wider">
                    Режим Настройки
                  </div>
                )}
              </div>
            </div>

            {/* ПАНЕЛЬ ТЕКУЩЕГО ХОДА И ТАЙМЕРА */}
            {isGameActive && turnOrder.length > 0 && activePlayer && !passed[activePlayer.id] && (
              <div className="bg-slate-950 border border-cyan-500/50 p-3 rounded-2xl flex flex-wrap items-center justify-between gap-3 mt-3 shadow-[0_0_15px_rgba(6,182,212,0.15)]">
                <div className="flex items-center gap-3">
                  {(() => {
                    const fact = ALL_FACTIONS.find(f => f.id === activePlayer.factionId);
                    return (
                      <div className="w-11 h-11 rounded-xl bg-slate-900 border border-slate-800 flex items-center justify-center p-1 overflow-hidden shadow">
                        <img src={fact?.iconUrl} alt={fact?.name} className="w-full h-full object-contain" />
                      </div>
                    );
                  })()}
                  <div>
                    <div className="text-[10px] text-cyan-400 font-bold uppercase tracking-wider">Сейчас ходит:</div>
                    <div className="font-bold text-white text-base md:text-lg leading-none">{activePlayer.name}</div>
                  </div>
                </div>

                {/* ТАЙМЕР ХОДА */}
                <div className="flex items-center gap-4 bg-slate-900 px-4 py-1.5 rounded-xl border border-slate-800">
                  <div className="text-center">
                    <div className="text-[9px] text-slate-500 uppercase font-bold">Ход</div>
                    <div className="font-orbitron font-bold text-amber-400 text-sm">{formatTime(turnTime)}</div>
                  </div>
                  <div className="w-px h-6 bg-slate-800"></div>
                  <div className="text-center">
                    <div className="text-[9px] text-slate-500 uppercase font-bold">Всего</div>
                    <div className="font-orbitron font-bold text-slate-300 text-sm">{formatTime(activePlayer.totalTime || 0)}</div>
                  </div>
                </div>

                {/* КНОПКИ ДЕЙСТВИЙ */}
                <div className="flex items-center gap-2">
                  <button onClick={nextTurn} className="bg-cyan-500 hover:bg-cyan-400 text-black font-extrabold px-4 py-2 rounded-xl text-xs md:text-sm flex items-center gap-1 shadow transition active:scale-95">
                    Завершить ход <i className="fa-solid fa-forward"></i>
                  </button>
                  <button onClick={() => passTurn(activePlayer.id)} className="bg-red-950 hover:bg-red-900 text-red-300 font-bold px-3 py-2 rounded-xl text-xs border border-red-800 transition">
                    Пас
                  </button>
                </div>
              </div>
            )}
          </header>

          {/* КОНТЕНТ */}
          <main className="p-4 md:p-6 flex-grow space-y-8">

            {/* 1. ЭКРАН НАСТРОЙКИ */}
            {!isGameActive && (
              <div className="max-w-4xl mx-auto space-y-6">

                {/* Параметры партии */}
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                  <h2 className="font-orbitron font-bold text-base text-amber-400 uppercase flex items-center gap-2">
                    <i className="fa-solid fa-sliders"></i> Параметры Партии
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                      <label className="text-xs font-bold text-slate-400 uppercase">Цель Победных Очков (ПО):</label>
                      <div className="flex gap-2">
                        {[10, 12, 14].map(score => (
                          <button
                            key={score}
                            onClick={() => setTargetScore(score)}
                            className={`flex-1 py-2 rounded-xl font-orbitron font-black text-sm border transition ${targetScore === score ? 'bg-amber-500 text-black border-amber-400 shadow-lg' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>
                            {score} ПО
                          </button>
                        ))}
                      </div>
                    </div>

                    <div className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-2">
                      <label className="text-xs font-bold text-slate-400 uppercase">Используемые Дополнения:</label>
                      <div className="flex gap-3">
                        <button
                          onClick={() => setUsePok(!usePok)}
                          className={`flex-1 py-2 px-3 rounded-xl font-bold text-xs border flex items-center justify-between transition ${usePok ? 'bg-purple-950 border-purple-500 text-purple-300' : 'bg-slate-900 border-slate-800 text-slate-600'}`}>
                          <span>Prophecy of Kings</span>
                          <i className={`fa-solid ${usePok ? 'fa-check-circle text-purple-400' : 'fa-circle text-slate-700'}`}></i>
                        </button>
                        <button
                          onClick={() => setUseTe(!useTe)}
                          className={`flex-1 py-2 px-3 rounded-xl font-bold text-xs border flex items-center justify-between transition ${useTe ? 'bg-amber-950 border-amber-500 text-amber-300' : 'bg-slate-900 border-slate-800 text-slate-600'}`}>
                          <span>Thunder's Edge</span>
                          <i className={`fa-solid ${useTe ? 'fa-check-circle text-amber-400' : 'fa-circle text-slate-700'}`}></i>
                        </button>
                      </div>
                    </div>
                  </div>
                </div>

                {/* Выбор игроков и фракций */}
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="font-orbitron font-bold text-base text-cyan-400 uppercase flex items-center gap-2">
                      <i className="fa-solid fa-users"></i> Игроки и Фракции ({players.length})
                    </h2>
                    {players.length < 8 && (
                      <button onClick={addPlayer} className="bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 font-bold px-3 py-1.5 rounded-xl text-xs transition flex items-center gap-1">
                        <i className="fa-solid fa-user-plus"></i> Добавить игрока
                      </button>
                    )}
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {players.map((p, idx) => {
                      const faction = ALL_FACTIONS.find(f => f.id === p.factionId);

                      return (
                        <div key={p.id} className="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3 relative">
                          <div className="flex items-center justify-between gap-3">
                            <span className="font-orbitron font-bold text-xs text-slate-500">#{idx + 1}</span>
                            <input
                              type="text"
                              value={p.name}
                              onChange={(e) => setPlayers(players.map(x => x.id === p.id ? { ...x, name: e.target.value } : x))}
                              className="bg-slate-900 border border-slate-800 px-3 py-1 rounded-lg font-bold text-sm text-white focus:outline-none focus:border-cyan-400 flex-grow"
                            />
                            {players.length > 2 && (
                              <button onClick={() => removePlayer(p.id)} className="text-slate-600 hover:text-red-400 p-1 transition">
                                <i className="fa-solid fa-trash-can"></i>
                              </button>
                            )}
                          </div>

                          <div className="flex items-center gap-3 bg-slate-900 p-2 rounded-lg border border-slate-800">
                            <div className="w-10 h-10 rounded-lg bg-slate-950 border border-slate-800 flex items-center justify-center p-1 overflow-hidden flex-shrink-0">
                              <img src={faction?.iconUrl} alt={faction?.name} className="w-full h-full object-contain" />
                            </div>
                            <div className="flex-grow">
                              <div className="text-[10px] uppercase font-bold text-slate-500">Фракция:</div>
                              <select
                                value={p.factionId}
                                onChange={(e) => setPlayers(players.map(x => x.id === p.id ? { ...x, factionId: e.target.value } : x))}
                                className="bg-transparent text-xs font-bold text-amber-400 focus:outline-none w-full">
                                {availableFactions.map(f => (
                                  <option
                                    key={f.id}
                                    value={f.id}
                                    disabled={isFactionTaken(f.id, p.id)}
                                    className="bg-slate-900 text-white"
                                  >
                                    {f.name}{isFactionTaken(f.id, p.id) ? " 🔒" : ""}
                                  </option>
                                ))}
                              </select>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* КНОПКА СТАРТА */}
                <button
                  onClick={() => setIsGameActive(true)}
                  className="w-full bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 text-black font-orbitron font-black text-lg py-4 rounded-2xl shadow-xl hover:opacity-95 transition transform active:scale-95 uppercase tracking-wider flex items-center justify-center gap-2">
                  <i className="fa-solid fa-play"></i> Начать партию
                </button>

              </div>
            )}

            {/* 2. ЭКРАН АКТИВНОЙ ИГРЫ */}
            {isGameActive && (
              <div className="space-y-8">

                {/* ПАНЕЛЬ ОЧЕРЕДНОСТИ ХОДОВ (TURN ORDER BAR) */}
                {turnOrder.length > 0 && (
                  <section className="bg-slate-900 border border-slate-800 p-4 rounded-2xl space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="font-orbitron font-bold text-xs uppercase text-slate-400 flex items-center gap-2">
                        <i className="fa-solid fa-list-ol text-cyan-400"></i> Очередность хода (По инициативе)
                      </h3>
                      <span className="text-[10px] font-bold text-slate-500 uppercase">
                        Активных: {turnOrder.filter(p => !passed[p.id]).length} / {turnOrder.length}
                      </span>
                    </div>

                    <div className="flex items-center gap-3 overflow-x-auto pb-2">
                      {turnOrder.map((p, idx) => {
                        const isCurrent = idx === activeTurnIdx && !passed[p.id];
                        const isPassed = !!passed[p.id];
                        const card = STRATEGY_CARDS.find(c => c.id === strategyPicks[p.id]);
                        const fact = ALL_FACTIONS.find(f => f.id === p.factionId);

                        return (
                          <div
                            key={p.id}
                            className={`flex-shrink-0 p-3 rounded-xl border min-w-[150px] transition relative ${
                              isCurrent
                                ? 'bg-cyan-950/80 border-cyan-400 shadow-[0_0_10px_rgba(6,182,212,0.3)] scale-105'
                                : isPassed
                                ? 'bg-slate-950/40 border-slate-900 opacity-40 grayscale'
                                : 'bg-slate-950 border-slate-800'
                            }`}
                          >
                            <div className="flex items-center justify-between gap-2 mb-2">
                              <span className="font-orbitron font-extrabold text-[10px] text-amber-400 bg-black/60 px-1.5 py-0.5 rounded">
                                Ин. {card?.initiative}
                              </span>
                              {isPassed && (
                                <span className="bg-red-950 text-red-400 border border-red-800 text-[9px] font-bold px-1.5 py-0.2 rounded uppercase">
                                  ПАС
                                </span>
                              )}
                            </div>

                            <div className="flex items-center gap-2">
                              <img src={fact?.iconUrl} alt={fact?.name} className="w-6 h-6 object-contain" />
                              <div className="truncate">
                                <div className="font-bold text-xs text-white truncate">{p.name}</div>
                                <div className="text-[10px] text-slate-400 font-orbitron">{formatTime(p.totalTime || 0)}</div>
                              </div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </section>
                )}

                {/* БЛОК 1: ТАБЛО ИГРОКОВ */}
                <section className="space-y-4">
                  <h2 className="font-orbitron font-bold text-base text-white uppercase flex items-center gap-2">
                    <i className="fa-solid fa-trophy text-amber-400"></i>
                    <span>Игровое Табло</span>
                  </h2>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {players.map(p => {
                      const score = getPlayerScore(p.id);
                      const faction = ALL_FACTIONS.find(f => f.id === p.factionId);
                      const isWinner = score >= targetScore;

                      return (
                        <div key={p.id} className={`p-4 rounded-2xl border flex flex-col justify-between space-y-3 ${isWinner ? 'bg-amber-950/40 border-amber-500 animate-pulse' : 'bg-slate-900 border-slate-800'}`}>
                          <div className="flex items-start gap-3">
                            <div className="w-16 h-16 rounded-2xl bg-slate-950 border border-slate-800 flex items-center justify-center p-1 flex-shrink-0 overflow-hidden" style={{ borderColor: `${faction?.color}aa` }}>
                              <img src={faction?.iconUrl} alt={faction?.name} className="w-full h-full object-contain" />
                            </div>

                            <div className="flex-grow">
                              <div className="flex items-center justify-between">
                                <div className="font-bold text-lg text-white">{p.name}</div>
                                <div className="font-orbitron font-black text-xl text-cyan-400 bg-slate-950 px-2.5 py-0.5 rounded-xl border border-slate-800">
                                  {score} ПО
                                </div>
                              </div>
                              <div className="text-xs font-bold text-slate-400 mt-1">{faction?.name}</div>
                              <div className="text-[10px] text-slate-500 font-orbitron mt-0.5">Время: {formatTime(p.totalTime || 0)}</div>
                            </div>
                          </div>

                          {useTe && (
                            <div className="flex items-center justify-between bg-amber-950/20 p-2 rounded-xl border border-amber-900/30 text-xs">
                              <span className="text-amber-300 font-bold">⚡ Прорыв (TE):</span>
                              <button
                                onClick={() => setPlayers(players.map(x => x.id === p.id ? { ...x, breakthrough: !x.breakthrough } : x))}
                                className={`px-2 py-0.5 rounded font-bold transition ${p.breakthrough ? 'bg-amber-500 text-black' : 'bg-slate-800 text-slate-400'}`}>
                                {p.breakthrough ? 'АКТИВЕН' : 'НЕТ'}
                              </button>
                            </div>
                          )}

                          <div className="flex items-center justify-between text-xs text-slate-400 border-t border-slate-800/80 pt-2">
                            <div>Секретки: <span className="text-amber-400 font-bold">{p.secrets}</span>
                              <button onClick={() => setPlayers(players.map(x => x.id === p.id ? { ...x, secrets: x.secrets + 1 } : x))} className="ml-1 px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-cyan-400 font-bold">+</button>
                              <button onClick={() => setPlayers(players.map(x => x.id === p.id ? { ...x, secrets: Math.max(0, x.secrets - 1) } : x))} className="ml-1 px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-400 font-bold">-</button>
                            </div>
                            <div>Мекатол: <span className="text-purple-400 font-bold">{p.extra}</span>
                              <button onClick={() => setPlayers(players.map(x => x.id === p.id ? { ...x, extra: x.extra + 1 } : x))} className="ml-1 px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-cyan-400 font-bold">+</button>
                              <button onClick={() => setPlayers(players.map(x => x.id === p.id ? { ...x, extra: Math.max(0, x.extra - 1) } : x))} className="ml-1 px-1.5 py-0.5 bg-slate-800 hover:bg-slate-700 rounded text-slate-400 font-bold">-</button>
                            </div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </section>

                {/* БЛОК 2: КАРТЫ СТРАТЕГИЙ */}
                <section className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <h2 className="font-orbitron font-bold text-base text-amber-400 uppercase flex items-center gap-2">
                      <i className="fa-solid fa-stopwatch"></i>
                      <span>Карты Стратегий</span>
                    </h2>

                    <button onClick={startActionPhase} className="bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-3.5 py-1.5 rounded-xl text-xs transition shadow">
                      <i className="fa-solid fa-play mr-1"></i> Начать Фазу Ходов
                    </button>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    {STRATEGY_CARDS.map(card => {
                      const pickedPlayerId = Object.keys(strategyPicks).find(pId => strategyPicks[pId] === card.id);
                      const isUsed = !!usedStrategies[card.id];

                      return (
                        <div key={card.id} className={`p-3 rounded-xl border flex flex-col justify-between transition relative overflow-hidden ${card.color} ${isUsed ? 'opacity-40 grayscale' : ''}`}>
                          <div className="flex items-center justify-between">
                            <div className="font-orbitron font-extrabold text-xs">{card.name}</div>
                            {pickedPlayerId && (
                              <button 
                                onClick={() => setUsedStrategies(prev => ({ ...prev, [card.id]: !prev[card.id] }))}
                                className={`text-xs px-1.5 py-0.5 rounded font-bold border transition ${isUsed ? 'bg-emerald-950 border-emerald-500 text-emerald-300' : 'bg-black/60 border-white/20 text-slate-300'}`}>
                                {isUsed ? '✓' : 'Сыграть'}
                              </button>
                            )}
                          </div>

                          <select
                            value={pickedPlayerId || ''}
                            onChange={(e) => {
                              const pId = Number(e.target.value);
                              setStrategyPicks(prev => ({ ...prev, [pId]: card.id }));
                            }}
                            className="bg-black/60 text-[11px] font-bold p-1 rounded text-white focus:outline-none mt-2">
                            <option value="">-- Игрок --</option>
                            {players.map(p => (
                              <option key={p.id} value={p.id}>{p.name}</option>
                            ))}
                          </select>
                        </div>
                      );
                    })}
                  </div>
                </section>

                {/* БЛОК 3: ПУБЛИЧНЫЕ ЗАДАНИЯ */}
                <section className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="font-orbitron font-bold text-base text-white flex items-center gap-2">
                      <i className="fa-solid fa-list-check text-cyan-400"></i>
                      <span>Публичные Задания</span>
                    </h2>
                    <button
                      onClick={addCustomObj}
                      className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1 transition"
                    >
                      <i className="fa-solid fa-plus"></i> Добавить цель
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {objectives.map(obj => (
                      <div key={obj.id} className="bg-slate-950 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg">
                        <div>
                          <span className={`text-[10px] font-extrabold px-2 py-0.5 rounded ${obj.stage === 2 ? 'bg-red-950 text-red-400 border border-red-800' : 'bg-blue-950 text-blue-400 border border-blue-800'}`}>
                            Этап {obj.stage} ({obj.points} ПО)
                          </span>
                          <h3 className="font-bold text-base text-white mt-1">{obj.title}</h3>
                          <p className="text-xs text-slate-400">{obj.desc}</p>
                        </div>

                        <div className="border-t border-slate-800 pt-2 grid grid-cols-2 gap-2">
                          {players.map(p => {
                            const isDone = !!completions[`${p.id}_${obj.id}`];
                            return (
                              <button
                                key={p.id}
                                onClick={() => toggleCompletion(p.id, obj.id)}
                                className={`p-1.5 rounded-lg border text-xs font-bold flex items-center justify-between transition ${isDone
                                    ? "bg-cyan-500/20 border-cyan-400 text-cyan-300"
                                    : "bg-slate-900 border-slate-800 text-slate-400"
                                  }`}
                              >
                                <span className="truncate">{p.name}</span>
                                <i className={`fa-solid ${isDone ? "fa-check text-cyan-400" : "fa-minus text-slate-700"}`}></i>
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    ))}
                  </div>
                </section>

              </div>
            )}

            {/* ВСПЛЫВАЮЩЕЕ ОКНО: КОНЕЦ РАУНДА */}
            {showRoundModal && (
              <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                <div className="bg-slate-900 border border-cyan-500/40 p-6 rounded-3xl max-w-md w-full space-y-5 text-center shadow-[0_0_30px_rgba(6,182,212,0.2)]">
                  <div className="w-16 h-16 bg-cyan-950 border border-cyan-500 rounded-2xl flex items-center justify-center mx-auto text-cyan-400 text-2xl">
                    <i className="fa-solid fa-flag-checkered"></i>
                  </div>

                  <div>
                    <h3 className="font-orbitron font-extrabold text-xl text-white">Раунд {roundNumber} Завершен!</h3>
                    <p className="text-xs text-slate-400 mt-1">Все игроки спасовали. Готовы перейти к Фазе Статуса и выбору новых карт стратегий?</p>
                  </div>

                  <div className="flex items-center gap-3 pt-2">
                    <button
                      onClick={() => setShowRoundModal(false)}
                      className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3 rounded-xl text-xs transition">
                      Отмена
                    </button>
                    <button
                      onClick={confirmNextRound}
                      className="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 text-black font-orbitron font-black py-3 rounded-xl text-xs shadow-lg transition transform active:scale-95">
                      Перейти к Раунду {roundNumber + 1}
                    </button>
                  </div>
                </div>
              </div>
            )}

          </main>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
