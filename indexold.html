<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TI4 Companion - XL Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Rajdhani:wght@700&family=Russo+One&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        .font-russo {
            font-family: 'Russo One', sans-serif;
        }

        .font-rajdhani {
            font-family: 'Rajdhani', sans-serif;
        }

        .font-chakra {
            font-family: 'Chakra Petch', sans-serif;
        }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-amber-500 selection:text-slate-950">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Константа реальных карт стратегий TI4
        const STRATEGY_CARDS_DATA = [
            { id: 1, name: "Leadership", ruName: "Инициатива", color: "from-red-600 to-red-800" },
            { id: 2, name: "Diplomacy", ruName: "Дипломатия", color: "from-amber-500 to-amber-700" },
            { id: 3, name: "Politics", ruName: "Политика", color: "from-yellow-500 to-yellow-700" },
            { id: 4, name: "Construction", ruName: "Строительство", color: "from-green-600 to-green-800" },
            { id: 5, name: "Trade", ruName: "Торговля", color: "from-teal-500 to-teal-700" },
            { id: 6, name: "Warfare", ruName: "Война", color: "from-cyan-600 to-cyan-800" },
            { id: 7, name: "Technology", ruName: "Технологии", color: "from-blue-600 to-blue-800" },
            { id: 8, name: "Imperial", ruName: "Империя", color: "from-purple-600 to-purple-800" }
        ];

        function App() {
            // Основное состояние игры
            const [players, setPlayers] = useState([
                { id: 1, name: "Игрок 1", faction: "", cards: [], lastMinInitiative: 1 },
                { id: 2, name: "Игрок 2", faction: "", cards: [], lastMinInitiative: 2 },
                { id: 3, name: "Игрок 3", faction: "", cards: [], lastMinInitiative: 3 }
            ]);
            const [round, setRound] = useState(1);
            const [gameStarted, setGameStarted] = useState(false);
            const [roundActive, setRoundActive] = useState(false);
            const [showEndGameModal, setShowEndGameModal] = useState(false);

            // Состояние окна выбора стратегий (Draft Modal)
            const [showDraftModal, setShowDraftModal] = useState(false);
            const [draftStep, setDraftStep] = useState('DRAFT'); // 'DRAFT' | 'CONFIRM'
            const [draftQueue, setDraftQueue] = useState([]);
            const [currentQueueIndex, setCurrentQueueIndex] = useState(0);
            const [draftAssignments, setDraftAssignments] = useState({}); // cardId -> playerId

            // Добавление / Удаление игроков на старте
            const addPlayer = () => {
                if (players.length >= 8) return;
                const newId = players.length + 1;
                setPlayers([...players, {
                    id: newId,
                    name: `Игрок ${newId}`,
                    faction: "",
                    cards: [],
                    lastMinInitiative: newId
                }]);
            };

            const removePlayer = (id) => {
                if (players.length <= 3) return;
                setPlayers(players.filter(p => p.id !== id));
            };

            const updatePlayerName = (id, name) => {
                setPlayers(players.map(p => p.id === id ? { ...p, name } : p));
            };

            const startGame = () => {
                setGameStarted(true);
            };

            // Логика запуска модального окна выбора карт
            const openStrategyDraft = () => {
                const cardsPerPlayer = players.length <= 4 ? 2 : 1;
                
                // Определение порядка выбора:
                // Раунд 1: По порядку добавления игроков
                // Раунд > 1: По минимальной инициативе карт прошлого раунда
                let sorted = [...players];
                if (round > 1) {
                    sorted.sort((a, b) => (a.lastMinInitiative || 99) - (b.lastMinInitiative || 99));
                }

                let queue = [];
                for (let r = 0; r < cardsPerPlayer; r++) {
                    sorted.forEach(p => queue.push(p.id));
                }

                setDraftQueue(queue);
                setCurrentQueueIndex(0);
                setDraftAssignments({});
                setDraftStep('DRAFT');
                setShowDraftModal(true);
            };

            const handleSelectCard = (cardId) => {
                const currentPlayerId = draftQueue[currentQueueIndex];
                const updatedAssignments = { ...draftAssignments, [cardId]: currentPlayerId };
                setDraftAssignments(updatedAssignments);

                const nextIndex = currentQueueIndex + 1;
                if (nextIndex >= draftQueue.length) {
                    setDraftStep('CONFIRM');
                } else {
                    setCurrentQueueIndex(nextIndex);
                }
            };

            const handleReassignCard = (cardId, newPlayerId) => {
                setDraftAssignments({
                    ...draftAssignments,
                    [cardId]: parseInt(newPlayerId)
                });
            };

            const confirmDraft = () => {
                // Обновляем выбранные карты у игроков
                const updatedPlayers = players.map(player => {
                    const assignedCardIds = Object.keys(draftAssignments)
                        .filter(cId => draftAssignments[cId] === player.id)
                        .map(Number);

                    const assignedCards = STRATEGY_CARDS_DATA.filter(c => assignedCardIds.includes(c.id));
                    const minInit = assignedCards.length > 0 ? Math.min(...assignedCards.map(c => c.id)) : player.id;

                    return {
                        ...player,
                        cards: assignedCards,
                        lastMinInitiative: minInit
                    };
                });

                setPlayers(updatedPlayers);
                setShowDraftModal(false);
            };

            // Управление раундами
            const handleStartRound = () => {
                setRoundActive(true);
            };

            const handleEndRound = () => {
                setRoundActive(false);
                setRound(prev => prev + 1);
            };

            const resetGameState = () => {
                setGameStarted(false);
                setRoundActive(false);
                setRound(1);
                setShowEndGameModal(false);
            };

            return (
                <div className="min-h-screen pb-12">
                    {/* Header */}
                    <header className="bg-slate-900/80 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-4 py-3">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <i className="fa-solid fa-[#1e293b] fa-shuttle-space text-amber-500 text-2xl"></i>
                                <h1 className="font-russo text-lg md:text-xl text-amber-400 tracking-wider">
                                    TI4 COMPANION
                                </h1>
                            </div>
                            {gameStarted && (
                                <div className="flex items-center gap-4">
                                    <div className="bg-slate-800 border border-slate-700 px-3 py-1 rounded-lg text-xs font-chakra">
                                        РАУНД <span className="text-amber-400 font-bold text-sm ml-1">{round}</span>
                                    </div>
                                    <button
                                        onClick={() => setShowEndGameModal(true)}
                                        className="text-slate-400 hover:text-red-400 text-sm transition"
                                    >
                                        <i className="fa-solid fa-power-off"></i>
                                    </button>
                                </div>
                            )}
                        </div>
                    </header>

                    <main className="max-w-7xl mx-auto px-4 mt-6">
                        {!gameStarted ? (
                            /* Экран подготовки */
                            <div className="max-w-xl mx-auto bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
                                <h2 className="font-russo text-xl text-amber-400 mb-4 text-center">ПОДГОТОВКА К ИГРЕ</h2>
                                <div className="space-y-3 mb-6">
                                    {players.map((p, idx) => (
                                        <div key={p.id} className="flex items-center gap-2">
                                            <span className="font-mono text-xs text-slate-500 w-6">#{idx + 1}</span>
                                            <input
                                                type="text"
                                                value={p.name}
                                                onChange={(e) => updatePlayerName(p.id, e.target.value)}
                                                className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm flex-1 focus:border-amber-500 outline-none"
                                            />
                                            {players.length > 3 && (
                                                <button
                                                    onClick={() => removePlayer(p.id)}
                                                    className="text-slate-600 hover:text-red-400 p-2 text-sm transition"
                                                >
                                                    <i className="fa-solid fa-xmark"></i>
                                                </button>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                <div className="flex gap-3">
                                    {players.length < 8 && (
                                        <button
                                            onClick={addPlayer}
                                            className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2.5 rounded-xl text-xs transition border border-slate-700"
                                        >
                                            + Игрок
                                        </button>
                                    )}
                                    <button
                                        onClick={startGame}
                                        className="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-russo py-2.5 rounded-xl text-sm transition shadow-lg shadow-amber-500/10"
                                    >
                                        НАЧАТЬ ИГРУ
                                    </button>
                                </div>
                            </div>
                        ) : (
                            /* Основной Дашборд */
                            <div>
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6 flex flex-wrap gap-3 items-center justify-between">
                                    <div className="flex items-center gap-2">
                                        <span className="text-xs text-slate-400 font-chakra">СТАТУС:</span>
                                        <span className={`text-xs font-bold px-2.5 py-1 rounded-md border ${
                                            roundActive 
                                                ? 'bg-emerald-950/50 border-emerald-800/80 text-emerald-400' 
                                                : 'bg-amber-950/50 border-amber-800/80 text-amber-400'
                                        }`}>
                                            {roundActive ? "РАУНД ИДЕТ" : "ФАЗА СТРАТЕГИЙ"}
                                        </span>
                                    </div>

                                    <div className="flex gap-2">
                                        <button
                                            onClick={openStrategyDraft}
                                            disabled={roundActive}
                                            className="bg-amber-500 hover:bg-amber-400 disabled:bg-slate-800 disabled:text-slate-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs transition border border-amber-400/30 shadow-md"
                                        >
                                            <i className="fa-solid fa-layer-group mr-1.5"></i> Выбор карт стратегий
                                        </button>

                                        {!roundActive ? (
                                            <button
                                                onClick={handleStartRound}
                                                className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-md"
                                            >
                                                <i className="fa-solid fa-play mr-1.5"></i> Начать раунд
                                            </button>
                                        ) : (
                                            <button
                                                onClick={handleEndRound}
                                                className="bg-indigo-600 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-md"
                                            >
                                                <i className="fa-solid fa-flag-checkered mr-1.5"></i> Завершить раунд
                                            </button>
                                        )}
                                    </div>
                                </div>

                                {/* Сетка игроков */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                    {players.map(p => (
                                        <div key={p.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 relative overflow-hidden">
                                            <div className="flex justify-between items-start mb-3">
                                                <h3 className="font-russo text-lg text-slate-100">{p.name}</h3>
                                                <span className="text-xs text-slate-500 font-mono">ID: {p.id}</span>
                                            </div>

                                            <div className="space-y-2 mt-4">
                                                <div className="text-xs text-slate-400 font-chakra uppercase tracking-wider">Карты стратегий:</div>
                                                {p.cards && p.cards.length > 0 ? (
                                                    <div className="flex flex-wrap gap-2">
                                                        {p.cards.map(c => (
                                                            <div key={c.id} className={`bg-gradient-to-r ${c.color} text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow`}>
                                                                #{c.id} {c.ruName} ({c.name})
                                                            </div>
                                                        ))}
                                                    </div>
                                                ) : (
                                                    <div className="text-xs text-slate-600 italic">Не выбраны</div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Модальное окно выбора карт стратегий */}
                        {showDraftModal && (
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-4xl w-full p-6 max-h-[90vh] overflow-y-auto shadow-2xl">
                                    <div className="flex justify-between items-center mb-4">
                                        <h2 className="font-russo text-xl text-amber-400">
                                            {draftStep === 'DRAFT' ? "ВЫБОР КАРТ СТРАТЕГИЙ" : "ПОДТВЕРЖДЕНИЕ И ОБМЕН"}
                                        </h2>
                                        <button
                                            onClick={() => setShowDraftModal(false)}
                                            className="text-slate-500 hover:text-slate-300 transition"
                                        >
                                            <i className="fa-solid fa-xmark text-lg"></i>
                                        </button>
                                    </div>

                                    {draftStep === 'DRAFT' && (
                                        <div>
                                            {/* Порядок драфта */}
                                            <div className="bg-slate-950 border border-slate-800 p-3 rounded-xl mb-4 flex flex-wrap gap-2 items-center">
                                                <span className="text-xs text-slate-400 font-chakra mr-1">ОЧЕРЕДЬ:</span>
                                                {draftQueue.map((pId, idx) => {
                                                    const player = players.find(p => p.id === pId);
                                                    const isCurrent = idx === currentQueueIndex;
                                                    return (
                                                        <span
                                                            key={idx}
                                                            className={`text-xs px-2.5 py-1 rounded-lg border ${
                                                                isCurrent
                                                                    ? 'bg-amber-500 text-slate-950 border-amber-400 font-bold scale-105'
                                                                    : idx < currentQueueIndex
                                                                    ? 'bg-slate-900 border-slate-800 text-slate-600 line-through'
                                                                    : 'bg-slate-900 border-slate-800 text-slate-400'
                                                            }`}
                                                        >
                                                            {player?.name}
                                                        </span>
                                                    );
                                                })}
                                            </div>

                                            {/* Карты */}
                                            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                                {STRATEGY_CARDS_DATA.map(card => {
                                                    const takenByPlayerId = draftAssignments[card.id];
                                                    const isTaken = !!takenByPlayerId;
                                                    const owner = players.find(p => p.id === takenByPlayerId);

                                                    return (
                                                        <button
                                                            key={card.id}
                                                            disabled={isTaken}
                                                            onClick={() => handleSelectCard(card.id)}
                                                            className={`p-3 rounded-xl border text-left transition relative flex flex-col justify-between h-32 ${
                                                                isTaken
                                                                    ? 'bg-slate-950/40 border-slate-800/50 opacity-40 cursor-not-allowed'
                                                                    : 'bg-slate-800/80 hover:bg-slate-800 border-slate-700 hover:border-amber-500/50'
                                                            }`}
                                                        >
                                                            <div>
                                                                <div className="font-russo text-2xl text-amber-400">#{card.id}</div>
                                                                <div className="font-bold text-xs text-slate-200 mt-1">{card.ruName}</div>
                                                                <div className="text-[10px] text-slate-400">{card.name}</div>
                                                            </div>

                                                            <div className="text-[10px] mt-2 font-mono">
                                                                {isTaken ? (
                                                                    <span className="text-amber-400 font-bold">Взял: {owner?.name}</span>
                                                                ) : (
                                                                    <span className="text-emerald-400">Свободна</span>
                                                                )}
                                                            </div>
                                                        </button>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    )}

                                    {draftStep === 'CONFIRM' && (
                                        <div className="space-y-4">
                                            <p className="text-xs text-slate-400">
                                                Проверьте список выбранных карт. Вы можете быстро обменять или переназначить карты игрокам при необходимости.
                                            </p>

                                            <div className="border border-slate-800 rounded-xl overflow-hidden">
                                                <table className="w-full text-left text-xs">
                                                    <thead className="bg-slate-950 text-slate-400 font-chakra">
                                                        <tr>
                                                            <th className="p-3">Карта</th>
                                                            <th className="p-3">Владелец</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody className="divide-y divide-slate-800">
                                                        {STRATEGY_CARDS_DATA.map(card => {
                                                            const ownerId = draftAssignments[card.id];
                                                            if (!ownerId) return null;

                                                            return (
                                                                <tr key={card.id} className="bg-slate-900/50">
                                                                    <td className="p-3 font-bold text-amber-400">
                                                                        #{card.id} {card.ruName} ({card.name})
                                                                    </td>
                                                                    <td className="p-3">
                                                                        <select
                                                                            value={ownerId}
                                                                            onChange={(e) => handleReassignCard(card.id, e.target.value)}
                                                                            className="bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-xs text-slate-200 focus:border-amber-500 outline-none"
                                                                        >
                                                                            {players.map(p => (
                                                                                <option key={p.id} value={p.id}>{p.name}</option>
                                                                            ))}
                                                                        </select>
                                                                    </td>
                                                                </tr>
                                                            );
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>

                                            <div className="flex justify-end pt-2">
                                                <button
                                                    onClick={confirmDraft}
                                                    className="bg-amber-500 hover:bg-amber-400 text-slate-950 font-russo px-5 py-2.5 rounded-xl text-xs transition shadow-lg shadow-amber-500/10"
                                                >
                                                    ПОДТВЕРДИТЬ И ЗАКРЫТЬ
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* Модалка выхода / сброса */}
                        {showEndGameModal && (
                            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                                <div className="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 text-center">
                                    <h3 className="font-russo text-lg text-slate-100 mb-2">Завершить партию?</h3>
                                    <p className="text-xs text-slate-400 mb-6">Текущий прогресс будет сброшен.</p>
                                    <div className="space-y-2">
                                        <button
                                            onClick={resetGameState}
                                            className="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 rounded-xl text-xs transition"
                                        >
                                            Завершить
                                        </button>
                                        <button
                                            onClick={() => setShowEndGameModal(false)}
                                            className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition border border-slate-700"
                                        >
                                            Продолжить
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
