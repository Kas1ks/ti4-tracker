<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TI4 Companion - XL Dashboard</title>
    <!-- Google Fonts: Russo One, Rajdhani, Chakra Petch -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Rajdhani:wght@700&family=Russo+One&display=swap"
        rel="stylesheet">

    <!-- Tailwind Custom Font Classes -->
    <style>
        .font-russo {
            font-family: 'Russo One', sans-serif;
        }

        .font-rajdhani {
            font-family: 'Rajdhani', sans-serif;
        }

        .font-chakra {
            font-family: 'Chakra Petch', sans-serif;
        }
    </style>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #030712;
            color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }

        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0b0f19;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
    </style>
</head>

<body class="min-h-screen pb-10">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const ALL_FACTIONS = [
            // Базовая игра
            { id: 'sol', name: 'Федерация Сол', color: '#3b82f6', exp: 'base', iconUrl: './factions/federation-of-sol.webp' },
            { id: 'jolnar', name: 'Университеты Джол-Нара', color: '#06b6d4', exp: 'base', iconUrl: './factions/universities-of-jol-nar.webp' },
            { id: 'hacan', name: 'Хаканские эмираты', color: '#eab308', exp: 'base', iconUrl: './factions/emirates-of-hacan.webp' },
            { id: 'xxcha', name: 'Королевство Ззча', color: '#22c55e', exp: 'base', iconUrl: './factions/xxcha-kingdom.webp' },
            { id: 'nekro', name: 'Некровирус', color: '#ef4444', exp: 'base', iconUrl: './factions/nekro-virus.webp' },
            { id: 'saar', name: 'Кланы Сааров', color: '#a855f7', exp: 'base', iconUrl: './factions/clan-of-saar.webp' },
            { id: 'l1z1x', name: 'ПсихосетьL1Z1X', color: '#64748b', exp: 'base', iconUrl: './factions/l1z1x-mindnet.webp' },
            { id: 'letnev', name: 'Баронат Летнев', color: '#475569', exp: 'base', iconUrl: './factions/barony-of-letnev.webp' },
            { id: 'arborec', name: 'Арбореки', color: '#15803d', exp: 'base', iconUrl: './factions/arborec.webp' },
            { id: 'creuss', name: 'Призраки Креуса', color: '#38bdf8', exp: 'base', iconUrl: './factions/ghosts-of-creuss.webp' },
            { id: 'mentak', name: 'Коалиция Ментака', color: '#f97316', exp: 'base', iconUrl: './factions/mentak-coalition.webp' },
            { id: 'muaat', name: 'Тлеющие с Муаата', color: '#dc2626', exp: 'base', iconUrl: './factions/embers-of-muaat.webp' },
            { id: 'naalu', name: 'Клубок Наалу', color: '#84cc16', exp: 'base', iconUrl: './factions/naalu-collective.webp' },
            { id: 'saardakk', name: 'Сардакк Нор', color: '#991b1b', exp: 'base', iconUrl: './factions/sardakk-norr.webp' },
            { id: 'yin', name: 'Братство Инь', color: '#e2e8f0', exp: 'base', iconUrl: './factions/yin-brotherhood.webp' },
            { id: 'yssaril', name: 'Племена Иссарилов', color: '#166534', exp: 'base', iconUrl: './factions/yssaril-tribes.webp' },
            { id: 'winnu', name: 'Винну', color: '#a855f7', exp: 'base', iconUrl: './factions/winnu.webp' },

            // Prophecy of Kings (PoK)
            { id: 'argent', name: 'Серебряная Стая', color: '#facc15', exp: 'pok', iconUrl: './factions/argent-flight.webp' },
            { id: 'empyrean', name: 'Возвышеные', color: '#818cf8', exp: 'pok', iconUrl: './factions/empyrean.webp' },
            { id: 'mahact', name: 'Генные чародеи Махакт', color: '#fbbf24', exp: 'pok', iconUrl: './factions/mahact-gene-sorcerers.webp' },
            { id: 'naazrokha', name: 'Альянс Нааз-Роха', color: '#10b981', exp: 'pok', iconUrl: './factions/naaz-rokha-alliance.webp' },
            { id: 'nomad', name: 'Кочевник (Nomad)', color: '#f43f5e', exp: 'pok', iconUrl: './factions/nomad.webp' },
            { id: 'titans', name: 'Титаны Ула', color: '#a1a1aa', exp: 'pok', iconUrl: './factions/titans-of-ul.webp' },
            { id: 'vuilraith', name: 'Кабала Вуил’Райт', color: '#b91c1c', exp: 'pok', iconUrl: './factions/vuil-raith-cabal.webp' },

            // Thunder's Edge (TE) и модули
            { id: 'keleres_argent', name: 'Совет Келерес (Аргенты)', color: '#38bdf8', exp: 'te', iconUrl: './factions/council-keleres-argent.webp' },
            { id: 'keleres_mentak', name: 'Совет Келерес (Ментак)', color: '#38bdf8', exp: 'te', iconUrl: './factions/council-keleres-mentak.webp' },
            { id: 'keleres_xxcha', name: 'Совет Келерес (Ззча)', color: '#38bdf8', exp: 'te', iconUrl: './factions/council-keleres-xxcha.webp' },
            { id: 'crimson', name: 'Багряное Восстание', color: '#dc2626', exp: 'te', iconUrl: './factions/crimson-rebellion.webp' },
            { id: 'deepwrought', name: 'Школа Глубин', color: '#0284c7', exp: 'te', iconUrl: './factions/deepwrought-scholarate.webp' },
            { id: 'firmament', name: 'Твердь Небесная', color: '#475569', exp: 'te', iconUrl: './factions/firmament-obsidian.webp' },
            { id: 'bastion', name: 'Последний Оплот', color: '#ca8a04', exp: 'te', iconUrl: './factions/last-bastion.webp' },
            { id: 'ralnel', name: 'Консорциум Рал-Нель', color: '#2563eb', exp: 'te', iconUrl: './factions/ral-nel-consortium.webp' }
        ];

        const STRATEGY_CARDS = [
            { id: 1, name: '1. Лидерство', initiative: 1, color: 'border-red-500 bg-red-950/50 text-red-300' },
            { id: 2, name: '2. Дипломатия', initiative: 2, color: 'border-amber-500 bg-amber-950/50 text-amber-300' },
            { id: 3, name: '3. Политика', initiative: 3, color: 'border-yellow-500 bg-yellow-950/50 text-yellow-300' },
            { id: 4, name: '4. Строительство', initiative: 4, color: 'border-emerald-500 bg-emerald-950/50 text-emerald-300' },
            { id: 5, name: '5. Торговля', initiative: 5, color: 'border-teal-500 bg-teal-950/50 text-teal-300' },
            { id: 6, name: '6. Война', initiative: 6, color: 'border-cyan-500 bg-cyan-950/50 text-cyan-300' },
            { id: 7, name: '7. Технологии', initiative: 7, color: 'border-blue-500 bg-blue-950/50 text-blue-300' },
            { id: 8, name: '8. Экспансия', initiative: 8, color: 'border-purple-500 bg-purple-950/50 text-purple-300' }
        ];

        const DEFAULT_OBJECTIVES = [
            { id: 'obj_1', title: 'Укрепить границы', stage: 1, points: 1, desc: 'Иметь сооружения на 2 планетах вне родной системы' },
            { id: 'obj_2', title: 'Расширить владения', stage: 1, points: 1, desc: 'Контролировать 6 планет вне родной системы' }
        ];

        const formatTime = (totalSeconds) => {
            const mins = Math.floor(totalSeconds / 60);
            const secs = totalSeconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        };

        function App() {
            const [isGameActive, setIsGameActive] = useState(() => JSON.parse(localStorage.getItem('ti4_active')) || false);
            const [targetScore, setTargetScore] = useState(() => JSON.parse(localStorage.getItem('ti4_targetScore')) || 10);
            const [roundNumber, setRoundNumber] = useState(() => JSON.parse(localStorage.getItem('ti4_round')) || 1);

            const [usePok, setUsePok] = useState(true);
            const [useTe, setUseTe] = useState(true);

            const [players, setPlayers] = useState(() => {
                return JSON.parse(localStorage.getItem('ti4_players')) || [
                    { id: 1, name: 'Игрок 1', factionId: 'sol', color: '#3b82f6', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
                    { id: 2, name: 'Игрок 2', factionId: 'jolnar', color: '#06b6d4', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
                    { id: 3, name: 'Игрок 3', factionId: 'hacan', color: '#eab308', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
                    { id: 4, name: 'Игрок 4', factionId: 'xxcha', color: '#22c55e', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
                    { id: 5, name: 'Игрок 5', factionId: 'nekro', color: '#ef4444', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
                    { id: 6, name: 'Игрок 6', factionId: 'saar', color: '#a855f7', secrets: 0, extra: 0, breakthrough: false, totalTime: 0 },
                ];
            });

            const [objectives, setObjectives] = useState(() => JSON.parse(localStorage.getItem('ti4_objectives')) || DEFAULT_OBJECTIVES);
            const [completions, setCompletions] = useState(() => JSON.parse(localStorage.getItem('ti4_completions')) || {});

            const [strategyPicks, setStrategyPicks] = useState({});
            const [usedStrategies, setUsedStrategies] = useState({});
            const [turnOrder, setTurnOrder] = useState([]);
            const [activeTurnIdx, setActiveTurnIdx] = useState(0);
            const [passed, setPassed] = useState({});

            // Модальные окна
            const [showStrategyModal, setShowStrategyModal] = useState(false);
            const [showRoundModal, setShowRoundModal] = useState(false);

            // Таймер
            const [turnTime, setTurnTime] = useState(0);

            useEffect(() => {
                localStorage.setItem('ti4_active', JSON.stringify(isGameActive));
                localStorage.setItem('ti4_targetScore', JSON.stringify(targetScore));
                localStorage.setItem('ti4_round', JSON.stringify(roundNumber));
                localStorage.setItem('ti4_players', JSON.stringify(players));
                localStorage.setItem('ti4_objectives', JSON.stringify(objectives));
                localStorage.setItem('ti4_completions', JSON.stringify(completions));
            }, [isGameActive, targetScore, roundNumber, players, objectives, completions]);

            const activePlayer = turnOrder[activeTurnIdx];
            const activeStrategyCard = activePlayer ? STRATEGY_CARDS.find(c => c.id === strategyPicks[activePlayer.id]) : null;
            const isCurrentStrategyPlayed = activeStrategyCard ? !!usedStrategies[activeStrategyCard.id] : false;

            // Таймер хода
            useEffect(() => {
                let interval = null;
                if (isGameActive && turnOrder.length > 0 && activePlayer && !passed[activePlayer.id]) {
                    interval = setInterval(() => {
                        setTurnTime(prev => prev + 1);
                        setPlayers(prevPlayers =>
                            prevPlayers.map(p => p.id === activePlayer.id ? { ...p, totalTime: (p.totalTime || 0) + 1 } : p)
                        );
                    }, 1000);
                }
                return () => clearInterval(interval);
            }, [isGameActive, turnOrder, activeTurnIdx, activePlayer, passed]);

            const availableFactions = ALL_FACTIONS.filter(f => {
                if (f.exp === 'base') return true;
                if (f.exp === 'pok' && usePok) return true;
                if (f.exp === 'te' && useTe) return true;
                return false;
            });

            const addPlayer = () => {
                if (players.length >= 8) return;
                const newId = Date.now();
                const unassignedFaction = availableFactions.find(f => !players.some(p => p.factionId === f.id)) || availableFactions[0];
                setPlayers([...players, { id: newId, name: `Игрок ${players.length + 1}`, factionId: unassignedFaction.id, secrets: 0, extra: 0, breakthrough: false, totalTime: 0 }]);
            };

            const removePlayer = (id) => {
                if (players.length <= 2) return;
                setPlayers(players.filter(p => p.id !== id));
            };

            const getPlayerScore = (playerId) => {
                const p = players.find(x => x.id === playerId);
                if (!p) return 0;
                let score = p.secrets + p.extra;
                objectives.forEach(obj => {
                    if (completions[`${playerId}_${obj.id}`]) score += obj.points;
                });
                return score;
            };

            const toggleCompletion = (pId, oId) => {
                const key = `${pId}_${oId}`;
                setCompletions(prev => ({ ...prev, [key]: !prev[key] }));
            };

            const addCustomObj = () => {
                const title = prompt('Введите название цели:');
                if (!title) return;
                const stage = prompt('Этап цели (1 или 2):', '1');
                const points = Number(stage) === 2 ? 2 : 1;
                setObjectives(prev => [...prev, { id: 'custom_' + Date.now(), title, stage: Number(stage), points, desc: 'Пользовательская цель' }]);
            };

            const confirmStrategyPicksAndStart = () => {
                const unpickedCount = players.filter(p => !strategyPicks[p.id]).length;
                if (unpickedCount > 0) {
                    alert('Все игроки должны выбрать карту стратегии!');
                    return;
                }

                const ordered = [...players]
                    .sort((a, b) => {
                        const cardA = STRATEGY_CARDS.find(c => c.id === strategyPicks[a.id]);
                        const cardB = STRATEGY_CARDS.find(c => c.id === strategyPicks[b.id]);
                        return (cardA?.initiative || 99) - (cardB?.initiative || 99);
                    });

                setTurnOrder(ordered);
                setActiveTurnIdx(0);
                setTurnTime(0);
                setPassed({});
                setShowStrategyModal(false);
            };

            const nextTurn = () => {
                if (turnOrder.length === 0) return;

                let nextIdx = (activeTurnIdx + 1) % turnOrder.length;
                let checkedCount = 0;

                while (passed[turnOrder[nextIdx].id] && checkedCount < turnOrder.length) {
                    nextIdx = (nextIdx + 1) % turnOrder.length;
                    checkedCount++;
                }

                const activeCount = turnOrder.filter(p => !passed[p.id]).length;
                if (activeCount === 0) {
                    setShowRoundModal(true);
                    return;
                }

                setActiveTurnIdx(nextIdx);
                setTurnTime(0);
            };

            const passTurn = (pId) => {
                if (!isCurrentStrategyPlayed) {
                    alert('Нельзя пасовать, пока вы не сыграли свою карту стратегии!');
                    return;
                }

                const updatedPassed = { ...passed, [pId]: true };
                setPassed(updatedPassed);

                const remainingActive = turnOrder.filter(p => !updatedPassed[p.id]);

                if (remainingActive.length === 0) {
                    setShowRoundModal(true);
                } else {
                    nextTurn();
                }
            };

            const confirmNextRound = () => {
                setShowRoundModal(false);
                setRoundNumber(prev => prev + 1);
                setStrategyPicks({});
                setUsedStrategies({});
                setTurnOrder([]);
                setActiveTurnIdx(0);
                setPassed({});
                setTurnTime(0);
                setShowStrategyModal(true);
            };

            const isFactionTaken = (factionId, currentPlayerId) => {
                return players.some(p => p.id !== currentPlayerId && p.factionId === factionId);
            };

            return (
                <div className="max-w-[1700px] mx-auto min-h-screen flex flex-col bg-slate-950 text-slate-100 px-3 md:px-8">

                    {/* ХЕДЕР */}
                    <header className="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-30 shadow-xl rounded-b-2xl">
                        <div className="flex items-center justify-between">
                            <div className="flex items-center gap-4">
                                <i className="fa-solid fa-khanda text-cyan-400 text-2xl md:text-3xl"></i>
                                <span className="font-orbitron font-black text-xl md:text-3xl text-white tracking-wider">TI4 TRACKER</span>
                            </div>

                            <div className="flex items-center gap-4">
                                {isGameActive ? (
                                    <>
                                        <div className="text-sm md:text-base font-bold text-amber-400 bg-slate-950 border border-slate-800 px-4 py-2 rounded-xl font-orbitron">
                                            РАУНД {roundNumber}
                                        </div>

                                        <div className="text-sm md:text-base font-bold text-cyan-400 bg-slate-950 border border-slate-800 px-4 py-2 rounded-xl font-orbitron">
                                            ЦЕЛЬ: {targetScore} ПО
                                        </div>

                                        {/* Кнопка доступна только пока фаза ходов НЕ запущенна (между раундами) */}
                                        {turnOrder.length === 0 && (
                                            <button
                                                onClick={() => setShowStrategyModal(true)}
                                                className="bg-amber-500 hover:bg-amber-400 text-black font-extrabold px-4 py-2 rounded-xl text-xs md:text-sm font-orbitron uppercase shadow transition">
                                                <i className="fa-solid fa-layer-group mr-1.5"></i> Выбор Стратегий
                                            </button>
                                        )}

                                        <button
                                            onClick={() => {
                                                if (confirm('Завершить игру? Весь прогресс, раунды и таймеры будут сброшены.')) {
                                                    setIsGameActive(false);
                                                    setRoundNumber(1);
                                                    setTurnOrder([]);
                                                    setStrategyPicks({});
                                                    setUsedStrategies({});
                                                    setPassed({});
                                                    setTurnTime(0);
                                                    setPlayers(prev => prev.map(p => ({ ...p, totalTime: 0, secrets: 0, extra: 0, breakthrough: false })));
                                                }
                                            }}
                                            className="bg-red-900/80 hover:bg-red-800 text-red-200 font-extrabold px-4 py-2 rounded-xl text-xs md:text-sm border border-red-700 transition flex items-center gap-1.5 shadow">
                                            <i className="fa-solid fa-square-xmark"></i>
                                            <span className="hidden sm:inline">Завершить</span>
                                        </button>
                                    </>
                                ) : (
                                    <div className="bg-cyan-950/80 text-cyan-400 border border-cyan-800 px-4 py-2 rounded-xl font-bold text-xs md:text-sm uppercase tracking-wider font-orbitron">
                                        Режим Настройки
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* ПАНЕЛЬ АКТИВНОГО ХОДА (КРУПНАЯ) */}
                        {isGameActive && turnOrder.length > 0 && activePlayer && !passed[activePlayer.id] && (
                            <div className="bg-slate-950 border-2 border-cyan-500/70 p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4 mt-4 shadow-[0_0_20px_rgba(6,182,212,0.2)]">
                                <div className="flex items-center gap-4">
                                    {(() => {
                                        const fact = ALL_FACTIONS.find(f => f.id === activePlayer.factionId);
                                        return (
                                            <div className="w-14 h-14 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center p-1 overflow-hidden shadow">
                                                <img src={fact?.iconUrl} alt={fact?.name} className="w-full h-full object-contain" />
                                            </div>
                                        );
                                    })()}
                                    <div>
                                        <div className="text-xs text-cyan-400 font-bold uppercase tracking-wider">Сейчас ходит:</div>
                                        <div className="font-bold text-white text-xl md:text-2xl leading-none">{activePlayer.name}</div>
                                    </div>
                                </div>

                                {/* ИНФО О КАРТЕ СТРАТЕГИИ */}
                                {activeStrategyCard && (
                                    <div className="flex items-center gap-3 bg-slate-900 px-4 py-2 rounded-xl border border-slate-800">
                                        <div>
                                            <div className="text-[10px] text-slate-400 uppercase font-bold">Карта Стратегии:</div>
                                            <div className="font-orbitron font-extrabold text-sm md:text-base text-amber-300">{activeStrategyCard.name}</div>
                                        </div>
                                        <button
                                            onClick={() => setUsedStrategies(prev => ({ ...prev, [activeStrategyCard.id]: !prev[activeStrategyCard.id] }))}
                                            className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${isCurrentStrategyPlayed
                                                ? 'bg-emerald-950 border-emerald-500 text-emerald-300'
                                                : 'bg-amber-500 hover:bg-amber-400 text-black border-amber-400 shadow'
                                                }`}>
                                            {isCurrentStrategyPlayed ? '✓ Сыграна' : 'Сыграть стратегию'}
                                        </button>
                                    </div>
                                )}

                                {/* ТАЙМЕРЫ */}
                                <div className="flex items-center gap-5 bg-slate-900 px-5 py-2 rounded-xl border border-slate-800">
                                    <div className="text-center">
                                        <div className="text-[10px] text-slate-500 uppercase font-bold">Ход</div>
                                        <div className="font-orbitron font-black text-amber-400 text-lg md:text-xl">{formatTime(turnTime)}</div>
                                    </div>
                                    <div className="w-px h-8 bg-slate-800"></div>
                                    <div className="text-center">
                                        <div className="text-[10px] text-slate-500 uppercase font-bold">Всего</div>
                                        <div className="font-orbitron font-bold text-slate-300 text-base md:text-lg">{formatTime(activePlayer.totalTime || 0)}</div>
                                    </div>
                                </div>

                                {/* КНОПКИ ДЕЙСТВИЙ */}
                                <div className="flex items-center gap-3">
                                    <button onClick={nextTurn} className="bg-cyan-500 hover:bg-cyan-400 text-black font-extrabold px-5 py-3 rounded-xl text-sm md:text-base flex items-center gap-2 shadow-lg transition active:scale-95 font-orbitron uppercase">
                                        Завершить ход <i className="fa-solid fa-forward"></i>
                                    </button>
                                    <button
                                        onClick={() => passTurn(activePlayer.id)}
                                        disabled={!isCurrentStrategyPlayed}
                                        title={!isCurrentStrategyPlayed ? "Сначала сыграйте карту стратегии!" : ""}
                                        className={`font-bold px-4 py-3 rounded-xl text-sm border transition ${isCurrentStrategyPlayed
                                            ? 'bg-red-950 hover:bg-red-900 text-red-300 border-red-800 cursor-pointer'
                                            : 'bg-slate-900 text-slate-600 border-slate-800 cursor-not-allowed opacity-60'
                                            }`}>
                                        Пас
                                    </button>
                                </div>
                            </div>
                        )}
                    </header>

                    {/* КОНТЕНТ */}
                    <main className="py-6 flex-grow space-y-8">

                                                                { name: 'Фиолетовый', hex: '#a855f7' },

                        {/* 2. ЭКРАН АКТИВНОЙ ИГРЫ */}

                            <div className="space-y-8">

                                        <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                                            <h2 className="font-orbitron font-bold text-base md:text-lg text-white flex items-center gap-2">
                                                <i className="fa-solid fa-list-check text-cyan-400"></i>
                                                <span>Публичные Задания</span>
                                            </h2>
                                            <button
                                                onClick={addCustomObj}
                                                className="bg-blue-600 hover:bg-blue-500 text-white font-bold px-3 py-1.5 rounded-xl text-xs flex items-center gap-1.5 transition"
                                            >
                                                <i className="fa-solid fa-plus"></i> Добавить
                                            </button>
                                        </div>

                                                        {players.map(p => {
                                                            const isDone = completions[`${p.id}_${obj.id}`];
                                                            const playerColor = p.color === '#000000' || p.color === '#0f172a' ? '#38bdf8' : (p.color || '#3b82f6');

                                                            return (
                                                                <button
                                                                    key={p.id}

                                                                        borderColor: isDone ? playerColor : undefined

                                                                        : 'bg-slate-900/60 text-slate-400 border-slate-800/80 hover:bg-slate-800 hover:text-slate-200'
                                                                        }`}

                                                                    <span className="truncate">{p.name}</span>

                                                                        <span
                                                                            className="text-[10px] w-4 h-4 rounded-full flex items-center justify-center text-black font-extrabold flex-shrink-0"
                                                                            style={{ backgroundColor: playerColor }}

                                                                            ✓

                                                                    )}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </section>

                                </div>
                            </div>
                        )

                        {/* ВСПЛЫВАЮЩЕЕ ОКНО 1: ВЫБОР КАРТ СТРАТЕГИЙ */}

                            showStrategyModal && (

                                                                className="bg-slate-900 border border-slate-800 text-xs md:text-sm font-bold text-amber-400 p-2 rounded-xl focus:outline-none w-full mt-1">
                                                                <option value="">-- Выберите карту --</option>
                                                                {STRATEGY_CARDS.map(card => {
                                                                    const isPickedByOther = Object.keys(strategyPicks).some(pId => Number(pId) !== p.id && strategyPicks[pId] === card.id);
                                                                    return (
                                                                        <option key={card.id} value={card.id} disabled={isPickedByOther} className="bg-slate-900 text-white">
                                                                            {card.name} {isPickedByOther ? '🔒' : ''}
                                                                        </option>
                                                                    );
                                                                })}
                                                            </select>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        <button
                                            onClick={confirmStrategyPicksAndStart}
                                            className="w-full bg-amber-500 hover:bg-amber-400 text-black font-orbitron font-black text-base md:text-lg py-4 rounded-2xl shadow-xl transition transform active:scale-95 uppercase">
                                            Начать Фазу Ходов
                                        </button>
                                    </div>
                                </div>
                            )
                        }

                        {/* ВСПЛЫВАЮЩЕЕ ОКНО 2: КОНЕЦ РАУНДА */}
                        {
                            showRoundModal && (
                                <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-md flex items-center justify-center p-4">
                                    <div className="bg-slate-900 border border-cyan-500/40 p-8 rounded-3xl max-w-lg w-full space-y-6 text-center shadow-[0_0_40px_rgba(6,182,212,0.25)]">
                                        <div className="w-20 h-20 bg-cyan-950 border-2 border-cyan-500 rounded-3xl flex items-center justify-center mx-auto text-cyan-400 text-3xl">
                                            <i className="fa-solid fa-flag-checkered"></i>
                                        </div>

                                        <div>
                                            <h3 className="font-orbitron font-black text-2xl text-white">Раунд {roundNumber} Завершен!</h3>
                                            <p className="text-sm text-slate-400 mt-2">Все игроки спасовали. Переходим к фазе СТАТУСА</p>
                                        </div>

                                        <div className="flex items-center gap-4 pt-2">
                                            <button
                                                onClick={() => setShowRoundModal(false)}
                                                className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-3.5 rounded-2xl text-xs md:text-sm transition">
                                                Отмена
                                            </button>
                                            <button
                                                onClick={confirmNextRound}
                                                className="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 text-black font-orbitron font-black py-3.5 rounded-2xl text-xs md:text-sm shadow-lg transition transform active:scale-95 uppercase">
                                                Раунд {roundNumber + 1} ➔
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )
                        }

                    </main >

                </div >
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
