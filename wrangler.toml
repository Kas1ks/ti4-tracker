name = "ti4-tracker"
main = "worker/index.js"
compatibility_date = "2024-12-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "ROOM_DIRECTORY"
class_name = "RoomDirectory"

[[durable_objects.bindings]]
name = "MILTY_DRAFTS"
class_name = "MiltyDraft"

[[migrations]]
tag = "v1-game-rooms"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2-room-directory"
new_sqlite_classes = ["RoomDirectory"]

[[migrations]]
tag = "v3-milty-drafts"
new_sqlite_classes = ["MiltyDraft"]

# Staging / previous prod snapshot:
#   https://ti4-tracker-dv.skvcom1.workers.dev
# Deploy: npm run deploy:dev  (from the branch you want as "old")
[env.dev]
name = "ti4-tracker-dv"

[env.dev.assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[env.dev.durable_objects.bindings]]
name = "GAME_ROOMS"
class_name = "GameRoom"

[[env.dev.durable_objects.bindings]]
name = "ROOM_DIRECTORY"
class_name = "RoomDirectory"

[[env.dev.durable_objects.bindings]]
name = "MILTY_DRAFTS"
class_name = "MiltyDraft"

[[env.dev.migrations]]
tag = "v1-game-rooms"
new_sqlite_classes = ["GameRoom"]

[[env.dev.migrations]]
tag = "v2-room-directory"
new_sqlite_classes = ["RoomDirectory"]

[[env.dev.migrations]]
tag = "v3-milty-drafts"
new_sqlite_classes = ["MiltyDraft"]
